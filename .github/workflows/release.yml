name: Release

# v로 시작하는 태그(예: v1.1.21)를 올리면 플러그인을 빌드해 릴리스를 만든다.
# 첨부는 서버에 올릴 플러그인 jar와 리소스팩 SHA-1 두 개뿐이다.
# 리소스팩 zip 자체는 main에서 그대로 받아가므로(README의 주소) 중복으로 붙이지 않는다.
on:
  push:
    tags:
      - 'v*'
  # 태그를 안 올리고 수동으로 돌리고 싶을 때를 위한 진입점
  workflow_dispatch:
    inputs:
      tag:
        description: '릴리스로 만들 태그 (예: v1.1.21)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Java 21 준비
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 태그와 pom.xml 버전 확인
        id: version
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          POM_VERSION=$(mvn -q --batch-mode -DforceStdout help:evaluate -Dexpression=project.version)
          if [ "v$POM_VERSION" != "$TAG" ]; then
            echo "::error::태그($TAG)와 pom.xml 버전($POM_VERSION)이 다릅니다. pom.xml의 <version>을 올렸는지 확인하세요."
            exit 1
          fi
          echo "version=$POM_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: 빌드
        run: mvn --batch-mode --no-transfer-progress clean package

      # 팩을 고치고 zip을 다시 안 올렸거나 README 해시를 안 맞췄으면 여기서 잡는다.
      # 해시가 틀린 팩은 클라이언트가 통째로 거부하므로 릴리스 전에 막는 편이 낫다.
      - name: 리소스팩 SHA-1 확인
        id: pack
        run: |
          scripts/pack-resourcepack.sh --check
          SHA1=$(sha1sum MyMinecraft-ResourcePack.zip | cut -d' ' -f1)
          echo "sha1=$SHA1" >> "$GITHUB_OUTPUT"
          # 첨부용 파일 (서버 관리자가 받아서 바로 쓰거나 스크립트로 비교할 수 있게)
          echo "$SHA1" > MyMinecraft-ResourcePack.zip.sha1
          # Actions 실행 화면 맨 위에 복사 버튼과 함께 뜬다
          {
            echo "## 리소스팩 SHA-1"
            echo
            echo '```'
            echo "$SHA1"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 릴리스 생성 및 파일 첨부
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA1: ${{ steps.pack.outputs.sha1 }}
        run: |
          gh release create "$TAG" \
            --title "MyMinecraft $TAG" \
            --generate-notes \
            "target/MyMinecraft-$VERSION.jar#플러그인 (plugins/ 폴더에 넣으세요)" \
            "MyMinecraft-ResourcePack.zip.sha1#리소스팩 SHA-1 (server.properties용)"

          # 자동 생성된 노트 뒤에 리소스팩 설정을 붙인다. 코드블록이라 릴리스 화면에서
          # 복사 버튼 한 번으로 server.properties에 그대로 옮길 수 있다.
          # 자동 생성된 노트 뒤에 리소스팩 해시만 붙인다. 주소는 버전이 바뀌어도 그대로라
          # (README의 리소스팩 항목) 매번 반복하지 않는다. 버전마다 달라지는 건 해시뿐이다.
          {
            gh release view "$TAG" --json body --jq .body
            echo
            echo "## 리소스팩"
            echo
            echo "\`server.properties\`의 해시를 아래 값으로 바꾸세요. 주소는 그대로 두면 됩니다."
            echo
            echo '```properties'
            echo "resource-pack-sha1=$SHA1"
            echo '```'
            echo
            echo "해시가 어긋나면 클라이언트가 팩을 거부합니다. 주소를 처음 넣는 거라면"
            echo "[README의 리소스팩 항목](https://github.com/$GITHUB_REPOSITORY#리소스팩-전용-아이템-커스텀-텍스처)을 보세요."
          } > notes.md
          gh release edit "$TAG" --notes-file notes.md
