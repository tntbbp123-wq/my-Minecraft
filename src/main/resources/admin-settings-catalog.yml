# 웹 관리 사이트(/_admin) "서버 설정" 화면용 설정 카탈로그 — config.yml 각 키의 한국어 이름·설명·형식.
# 이 파일은 jar 안에 들어가고, 관리 사이트가 연결 통로(GET /v1/settings-catalog)로 받아 가요.
# config.yml 에 키를 추가·이름 변경·삭제하면 이 파일도 같은 키로 같이 고쳐야 해요(CLAUDE.md 7절).
# 형식: gn-admin docs/api-p5-plugins-settings.md §7.1. 검사: mvn -Dtest=AdminSettingsCatalogTest test
version: 1
files:
  - id: "plugin:MyMinecraft/config.yml"
    path: plugins/MyMinecraft/config.yml
    format: yaml
    kind: plugin
    plugin: MyMinecraft
    label: "마이마인크래프트 설정"
    keys:
      - key: config-version
        label: "설정 구조 버전"
        desc: "플러그인이 새 버전으로 올라갈 때 이 설정 파일을 자동으로 고치는 데 쓰는 번호예요. 직접 바꾸지 마세요."
        type: int
        min: 1
        default: 2
        restart: true
        secret: false
        risk: high
        verify: false
        editable: false
        note: "잘못 바꾸면 다음 업데이트 때 설정이 엉뚱하게 옮겨질 수 있어요."

      - key: economy.starting-balance
        label: "시작 잔액"
        desc: "새로 접속한 플레이어가 처음 갖고 시작하는 돈이에요."
        type: "float"
        min: 0
        default: 1000.0
        restart: true
        secret: false
        risk: "low"
        verify: false

      - key: economy.currency-name
        label: "화폐 단위"
        desc: "돈 옆에 붙는 단위 글자예요(예: G)."
        type: "string"
        max_len: 16
        default: "G"
        restart: true
        secret: false
        risk: "low"
        verify: false

      - key: web-bridge.enabled
        label: "관리자 사이트 연결 사용"
        desc: "게임 서버와 웹 관리자(gn-admin)를 잇는 통로를 켤지 정해요."
        type: "bool"
        default: true
        restart: true
        secret: false
        risk: "high"
        verify: false
        note: "바꾸면 관리자 사이트 연결이 끊길 수 있어요."

      - key: web-bridge.host
        label: "관리자 사이트 연결 주소"
        desc: "통로가 열리는 네트워크 주소예요. 보안상 127.0.0.1(이 서버 안)로만 둬야 해요."
        type: "string"
        max_len: 64
        default: "127.0.0.1"
        restart: true
        secret: false
        risk: "high"
        verify: false
        note: "바꾸면 관리자 사이트 연결이 끊길 수 있어요."

      - key: web-bridge.port
        label: "관리자 사이트 연결 포트"
        desc: "통로가 열리는 포트 번호예요."
        type: "int"
        min: 1
        max: 65535
        default: 25590
        restart: true
        secret: false
        risk: "high"
        verify: false
        note: "바꾸면 관리자 사이트 연결이 끊길 수 있어요."

      - key: web-bridge.token
        label: "관리자 사이트 연결 토큰"
        desc: "웹 백엔드가 이 통로에 접속할 때 쓰는 비밀 값이에요."
        type: "secret"
        default: ""
        restart: true
        secret: true
        risk: "high"
        verify: false
        note: "바꾸면 관리자 사이트 연결이 끊길 수 있어요."

      - key: web-bridge.threads
        label: "관리자 사이트 동시 처리 수"
        desc: "관리자 사이트에서 오는 요청을 한꺼번에 몇 개까지 처리할지 정해요. 1보다 작게 적으면 1로 처리돼요."
        type: int
        min: 1
        default: 2
        restart: true
        secret: false
        risk: medium
        verify: false

      - key: web-bridge.max-body-bytes
        label: "관리자 사이트 요청 최대 크기"
        desc: "관리자 사이트가 한 번에 보낼 수 있는 요청 내용의 최대 크기(바이트)예요. 1024보다 작게 적으면 1024로 처리돼요."
        type: int
        min: 1024
        default: 65536
        restart: true
        secret: false
        risk: medium
        verify: false

      - key: web-bridge.sync-timeout-ms
        label: "요청 처리 시작 제한 시간"
        desc: "게임 서버가 이 시간(밀리초, 1000=1초) 안에 관리자 사이트 요청을 처리하기 시작하지 못하면 실행하지 않고 거절해요. 100보다 작게 적으면 100으로 처리돼요."
        type: int
        min: 100
        default: 5000
        restart: true
        secret: false
        risk: medium
        verify: false

      - key: web-bridge.save-timeout-ms
        label: "월드 저장 제한 시간"
        desc: "관리자 사이트에서 서버 저장(접속자·월드 저장)을 실행할 때 기다려 주는 최대 시간(밀리초, 1000=1초)이에요. 위 '요청 처리 시작 제한 시간'보다 짧게 적으면 그 값으로 처리돼요."
        type: int
        min: 100
        default: 30000
        restart: true
        secret: false
        risk: medium
        verify: false

      - key: web-bridge.idempotency-ttl-seconds
        label: "중복 요청 방지 기억 시간"
        desc: "관리자 사이트가 같은 요청을 다시 보내도 두 번 실행되지 않도록 결과를 기억해 두는 시간(초)이에요. 1보다 작게 적으면 1로 처리돼요."
        type: int
        min: 1
        default: 600
        restart: true
        secret: false
        risk: medium
        verify: false

      - key: activity-log.enabled
        label: "활동 기록 사용"
        desc: "접속·퇴장·채팅·명령어·사망 기록을 남길지 정해요. 거래·관리 기록은 이 값과 상관없이 항상 남아요."
        type: "bool"
        default: true
        restart: true
        secret: false
        risk: "low"
        verify: false

      - key: activity-log.chat
        label: "채팅 기록"
        desc: "플레이어 채팅 내용을 활동 기록에 남길지 정해요. '활동 기록 사용'이 꺼져 있으면 이 값과 상관없이 안 남아요."
        type: bool
        default: true
        restart: true
        secret: false
        risk: low
        verify: false

      - key: activity-log.commands
        label: "명령어 기록"
        desc: "플레이어가 쓴 명령어와 관리자 사이트에서 실행한 명령어를 활동 기록에 남길지 정해요. '활동 기록 사용'이 꺼져 있으면 안 남아요."
        type: bool
        default: true
        restart: true
        secret: false
        risk: low
        verify: false

      - key: activity-log.redact-commands
        label: "기록에서 가릴 명령어"
        desc: "여기 적은 명령어(맨 앞 단어, / 없이)는 기록에 남길 때 뒤에 붙은 내용을 ***로 가려요. 인증 코드처럼 남기면 안 되는 값이 있는 명령어를 적어요."
        type: list
        default: ["디스코드연동확인", "디스코드연동"]
        restart: true
        secret: false
        risk: low
        verify: false

      - key: activity-log.queue-limit
        label: "활동 기록 대기열 최대치"
        desc: "한 번에 기록 대기시킬 수 있는 최대 개수예요. 넘치면 서버가 멈추지 않도록 그냥 버려요."
        type: "int"
        min: 1
        default: 10000
        restart: true
        secret: false
        risk: "low"
        verify: false

      - key: activity-log.retention-days
        label: "활동 기록 보관 기간"
        desc: "이 기간(일)보다 오래된 활동 기록 파일은 자동으로 지워져요. 0 이하면 안 지워요."
        type: "int"
        min: 0
        default: 90
        restart: true
        secret: false
        risk: "low"
        verify: false

      - key: home.max-homes
        label: "최대 홈 개수"
        desc: "한 플레이어가 등록할 수 있는 홈(순간이동 지점) 최대 개수예요."
        type: "int"
        min: 0
        max: 100
        default: 5
        restart: true
        secret: false
        risk: "low"
        verify: false

      - key: mail.regular-retention-days
        label: "일반 우편 보관 기간"
        desc: "시스템·퀘스트 우편이 자동 삭제되기까지 보관되는 기간(일)이에요."
        type: "int"
        min: 1
        default: 7
        restart: true
        secret: false
        risk: "low"
        verify: false

      - key: mail.regular-max-count
        label: "일반 우편함 최대 개수"
        desc: "한 플레이어의 일반 우편함에 쌓일 수 있는 최대 우편 개수예요. 가득 차면 새 우편이 보류돼요."
        type: "int"
        min: 1
        default: 50
        restart: true
        secret: false
        risk: "low"
        verify: false

      - key: mail.admin-retention-days
        label: "관리자 우편 보관 기간"
        desc: "웹에서 보낸 관리자 우편이 자동 삭제되기까지 보관되는 기간(일)이에요."
        type: "int"
        min: 1
        default: 30
        restart: true
        secret: false
        risk: "low"
        verify: false

      - key: mail.admin-max-count
        label: "관리자 우편 최대 개수"
        desc: "관리자(웹) 우편이 한 사람 우편함에 쌓일 수 있는 최대 개수예요(받지 않은 우편 전체 기준). 0이면 제한이 없어요."
        type: int
        min: 0
        default: 0
        restart: true
        secret: false
        risk: low
        verify: false

      - key: mail.send-batch-delay-ticks
        label: "우편 발송 대기열 간격"
        desc: "퀘스트 보상 같은 예약 발송 우편을 처리하는 간격(틱, 20틱=1초)이에요. 웹에서 바로 보내는 우편에는 영향 없어요."
        type: "int"
        min: 1
        default: 60
        restart: true
        secret: false
        risk: "low"
        verify: false

      - key: tpa.request-timeout-seconds
        label: "TPA 요청 유효 시간"
        desc: "순간이동 요청(TPA)이 자동으로 취소되기까지 걸리는 시간(초)이에요."
        type: "int"
        min: 1
        default: 30
        restart: true
        secret: false
        risk: "low"
        verify: false

      - key: combat.tag-seconds
        label: "전투 태그 지속 시간"
        desc: "공격하거나 맞으면 이 시간(초) 동안 '전투 중' 상태가 돼요. 전투 중에는 대부분 명령어를 못 써요."
        type: "int"
        min: 0
        default: 45
        restart: true
        secret: false
        risk: "low"
        verify: false

      - key: combat.music.enabled
        label: "전투 음악 사용"
        desc: "전투 중에 전투 음악을 재생할지 정해요. 리소스팩에 음원을 넣어야 실제로 소리가 나요."
        type: "bool"
        default: false
        restart: true
        secret: false
        risk: "low"
        verify: false

      - key: combat.music.sound
        label: "전투 음악 소리 이름"
        desc: "리소스팩(sounds.json)에 등록한 전투 음악의 소리 이름이에요. 리소스팩에 적은 이름과 똑같아야 소리가 나요."
        type: string
        max_len: 128
        default: "myminecraft:music.combat"
        restart: true
        secret: false
        risk: low
        verify: false

      - key: combat.music.track-length-seconds
        label: "전투 음악 길이"
        desc: "전투 음악 한 곡의 길이(초)예요. 전투가 이보다 길어지면 처음부터 다시 틀어서 끊기지 않게 해요."
        type: int
        min: 1
        default: 142
        restart: true
        secret: false
        risk: low
        verify: false

      - key: combat.music.volume
        label: "전투 음악 크기"
        desc: "전투 음악 소리 크기예요. 1이 원래 크기이고 0에 가까울수록 작아져요. 플레이어 게임 설정의 '음악' 음량도 함께 적용돼요."
        type: float
        min: 0
        max: 1
        step: 0.05
        default: 0.7
        restart: true
        secret: false
        risk: low
        verify: false

      - key: randomtp.max-radius
        label: "랜덤 이동 최대 반경"
        desc: "월드 스폰 중심에서 랜덤 이동이 가능한 최대 거리(블록)예요."
        type: "int"
        min: 1
        default: 5000
        restart: true
        secret: false
        risk: "low"
        verify: false

      - key: randomtp.exclude-size
        label: "랜덤 이동 제외 구역 크기"
        desc: "스폰 중심 주변 이 크기(블록)만큼은 랜덤 이동 대상에서 빠져요."
        type: "int"
        min: 0
        default: 500
        restart: true
        secret: false
        risk: "low"
        verify: false

      - key: randomtp.cooldown-seconds
        label: "랜덤 이동 재사용 대기시간"
        desc: "랜덤 이동을 다시 쓸 수 있을 때까지 기다려야 하는 시간(초)이에요."
        type: "int"
        min: 0
        default: 30
        restart: true
        secret: false
        risk: "low"
        verify: false

      - key: randomtp.max-attempts
        label: "랜덤 이동 위치 찾기 횟수"
        desc: "안전하게 내릴 수 있는 곳을 찾을 때 최대 몇 번까지 다시 뽑아볼지 정해요. 이 안에 못 찾으면 이동이 취소돼요."
        type: int
        min: 1
        default: 30
        restart: true
        secret: false
        risk: low
        verify: false

      - key: currency.coins
        label: "동전 종류 목록"
        desc: "주식 거래소에서 포인트와 바꿀 수 있는 실물 동전(1G·10G·100G·1000G·10000G 동전)의 종류·금액·이름·모양 목록이에요. 여러 값이 묶여 있어서 여기서는 볼 수만 있어요."
        type: list
        restart: true
        secret: false
        risk: low
        verify: false
        editable: false

      - key: stock.update-interval-seconds
        label: "주식 가격 갱신 주기"
        desc: "주식 가격이 새로 계산되는 주기(초)예요."
        type: "int"
        min: 1
        default: 3600
        restart: true
        secret: false
        risk: "low"
        verify: false

      - key: stock.list
        label: "처음 옮겨 담을 기본 종목"
        desc: "예전 방식의 기본 주식 종목 목록이에요. 서버를 켤 때 한 번만 주식 데이터로 옮겨지고, 그 뒤로는 게임 안 명령어나 관리자 사이트의 주식 메뉴에서 관리해요. 여러 값이 묶여 있어서 여기서는 볼 수만 있어요."
        type: list
        restart: true
        secret: false
        risk: low
        verify: false
        editable: false

      - key: news.reveal-delay-seconds
        label: "뉴스 공개까지 시간"
        desc: "뉴스를 작성한 뒤 거래소 화면에 보이기 시작하기까지 걸리는 시간(초)이에요."
        type: "int"
        min: 0
        default: 3600
        restart: true
        secret: false
        risk: "low"
        verify: false

      - key: news.apply-delay-seconds
        label: "뉴스 가격 반영까지 시간"
        desc: "뉴스를 작성한 뒤 실제로 주가에 반영되기까지 걸리는 시간(초)이에요."
        type: "int"
        min: 0
        default: 7200
        restart: true
        secret: false
        risk: "low"
        verify: false

      - key: news.ai-min-magnitude-percent
        label: "AI 뉴스 최소 변동폭"
        desc: "'AI:주제'로 뉴스를 쓸 때 AI가 정하는 주가 변동폭(%)의 최솟값이에요. AI가 이보다 작게 정하면 이 값으로 맞춰요."
        type: float
        min: 0
        max: 100
        default: 1.0
        restart: true
        secret: false
        risk: low
        verify: false

      - key: news.ai-max-magnitude-percent
        label: "AI 뉴스 최대 변동폭"
        desc: "'AI:주제'로 뉴스를 쓸 때 AI가 정하는 주가 변동폭(%)의 최댓값이에요. AI가 이보다 크게 정하면 이 값으로 맞춰요."
        type: float
        min: 0
        max: 100
        default: 10.0
        restart: true
        secret: false
        risk: low
        verify: false

      - key: ai.enabled
        label: "AI 뉴스 생성 사용"
        desc: "'AI:주제' 형식으로 뉴스를 작성하면 AI가 기사 본문을 자동으로 써주는 기능을 켜요."
        type: "bool"
        default: false
        restart: true
        secret: false
        risk: "low"
        verify: false

      - key: ai.provider
        label: "AI 서비스 종류"
        desc: "어떤 AI 서비스를 쓸지 적는 칸이에요. 지금 플러그인은 이 값을 읽지 않고 항상 Gemini를 써요."
        type: string
        max_len: 32
        default: "gemini"
        restart: true
        secret: false
        risk: low
        verify: false

      - key: ai.api-key
        label: "AI API 키"
        desc: "뉴스 자동 작성에 쓰는 AI 서비스 열쇠(키)예요."
        type: "secret"
        default: ""
        restart: true
        secret: true
        risk: "medium"
        verify: false
        note: "요금이 나올 수 있는 키예요. 유출되면 바로 새로 발급받으세요."

      - key: ai.model
        label: "AI 모델 이름"
        desc: "뉴스 자동 작성에 쓸 AI 모델 이름이에요."
        type: "string"
        max_len: 64
        default: "gemini-2.5-flash"
