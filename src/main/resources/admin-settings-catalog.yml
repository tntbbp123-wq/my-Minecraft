# 웹 관리 사이트(/_admin) "서버 설정" 화면용 설정 카탈로그 — config.yml 각 키의 한국어 이름·설명·형식.
# 이 파일은 jar 안에 들어가고, 관리 사이트가 연결 통로(GET /v1/settings-catalog)로 받아 가요.
# config.yml 에 키를 추가·이름 변경·삭제하면 이 파일도 같은 키로 같이 고쳐야 해요(CLAUDE.md 7절).
# 형식: gn-admin docs/api-p5-plugins-settings.md §7.1. 검사: mvn -Dtest=AdminSettingsCatalogTest test
version: 1
files:
  - id: "plugin:MyMinecraft/config.yml"
    path: plugins/MyMinecraft/config.yml
    format: yaml
    kind: plugin
    plugin: MyMinecraft
    label: "마이마인크래프트 설정"
    keys:
      - key: economy.starting-balance
        label: "시작 잔액"
        desc: "새로 접속한 플레이어가 처음 갖고 시작하는 돈이에요."
        type: float
        min: 0
        default: 1000.0
        restart: true
        secret: false
        risk: low
        verify: false

      - key: economy.currency-name
        label: "화폐 단위"
        desc: "돈 옆에 붙는 단위 글자예요(예: G)."
        type: string
        max_len: 16
        default: "G"
        restart: true
        secret: false
        risk: low
        verify: false

      - key: home.max-homes
        label: "최대 홈 개수"
        desc: "한 플레이어가 등록할 수 있는 홈(순간이동 지점) 최대 개수예요."
        type: int
        min: 0
        max: 100
        default: 5
        restart: true
        secret: false
        risk: low
        verify: false

      - key: tpa.request-timeout-seconds
        label: "TPA 요청 유효 시간"
        desc: "순간이동 요청(TPA)이 자동으로 취소되기까지 걸리는 시간(초)이에요."
        type: int
        min: 1
        default: 30
        restart: true
        secret: false
        risk: low
        verify: false

      - key: combat.tag-seconds
        label: "전투 태그 지속 시간"
        desc: "공격하거나 맞으면 이 시간(초) 동안 '전투 중' 상태가 돼요. 전투 중에는 대부분 명령어를 못 써요."
        type: int
        min: 0
        default: 45
        restart: true
        secret: false
        risk: low
        verify: false

      - key: combat.music.enabled
        label: "전투 음악 사용"
        desc: "전투 중에 전투 음악을 재생할지 정해요. 리소스팩에 음원을 넣어야 실제로 소리가 나요."
        type: bool
        default: false
        restart: true
        secret: false
        risk: low
        verify: false

      - key: randomtp.max-radius
        label: "랜덤 이동 최대 반경"
        desc: "월드 스폰 중심에서 랜덤 이동이 가능한 최대 거리(블록)예요."
        type: int
        min: 1
        default: 5000
        restart: true
        secret: false
        risk: low
        verify: false

      - key: randomtp.exclude-size
        label: "랜덤 이동 제외 구역 크기"
        desc: "스폰 중심 주변 이 크기(블록)만큼은 랜덤 이동 대상에서 빠져요."
        type: int
        min: 0
        default: 500
        restart: true
        secret: false
        risk: low
        verify: false

      - key: randomtp.cooldown-seconds
        label: "랜덤 이동 재사용 대기시간"
        desc: "랜덤 이동을 다시 쓸 수 있을 때까지 기다려야 하는 시간(초)이에요."
        type: int
        min: 0
        default: 30
        restart: true
        secret: false
        risk: low
        verify: false

      - key: mail.regular-retention-days
        label: "일반 우편 보관 기간"
        desc: "시스템·퀘스트 우편이 자동 삭제되기까지 보관되는 기간(일)이에요."
        type: int
        min: 1
        default: 7
        restart: true
        secret: false
        risk: low
        verify: false

      - key: mail.regular-max-count
        label: "일반 우편함 최대 개수"
        desc: "한 플레이어의 일반 우편함에 쌓일 수 있는 최대 우편 개수예요. 가득 차면 새 우편이 보류돼요."
        type: int
        min: 1
        default: 50
        restart: true
        secret: false
        risk: low
        verify: false

      - key: mail.admin-retention-days
        label: "관리자 우편 보관 기간"
        desc: "웹에서 보낸 관리자 우편이 자동 삭제되기까지 보관되는 기간(일)이에요."
        type: int
        min: 1
        default: 30
        restart: true
        secret: false
        risk: low
        verify: false

      - key: mail.send-batch-delay-ticks
        label: "우편 발송 대기열 간격"
        desc: "퀘스트 보상 같은 예약 발송 우편을 처리하는 간격(틱, 20틱=1초)이에요. 웹에서 바로 보내는 우편에는 영향 없어요."
        type: int
        min: 1
        default: 60
        restart: true
        secret: false
        risk: low
        verify: false

      - key: stock.update-interval-seconds
        label: "주식 가격 갱신 주기"
        desc: "주식 가격이 새로 계산되는 주기(초)예요."
        type: int
        min: 1
        default: 3600
        restart: true
        secret: false
        risk: low
        verify: false

      - key: news.reveal-delay-seconds
        label: "뉴스 공개까지 시간"
        desc: "뉴스를 작성한 뒤 거래소 화면에 보이기 시작하기까지 걸리는 시간(초)이에요."
        type: int
        min: 0
        default: 3600
        restart: true
        secret: false
        risk: low
        verify: false

      - key: news.apply-delay-seconds
        label: "뉴스 가격 반영까지 시간"
        desc: "뉴스를 작성한 뒤 실제로 주가에 반영되기까지 걸리는 시간(초)이에요."
        type: int
        min: 0
        default: 7200
        restart: true
        secret: false
        risk: low
        verify: false

      - key: ai.enabled
        label: "AI 뉴스 생성 사용"
        desc: "'AI:주제' 형식으로 뉴스를 작성하면 AI가 기사 본문을 자동으로 써주는 기능을 켜요."
        type: bool
        default: false
        restart: true
        secret: false
        risk: low
        verify: false

      - key: ai.api-key
        label: "AI API 키"
        desc: "뉴스 자동 작성에 쓰는 AI 서비스 열쇠(키)예요."
        type: secret
        default: ""
        restart: true
        secret: true
        risk: medium
        verify: false
        note: "요금이 나올 수 있는 키예요. 유출되면 바로 새로 발급받으세요."

      - key: ai.model
        label: "AI 모델 이름"
        desc: "뉴스 자동 작성에 쓸 AI 모델 이름이에요."
        type: string
        max_len: 64
        default: "gemini-2.5-flash"
        restart: true
        secret: false
        risk: low
        verify: false

      - key: discord.bot-token
        label: "디스코드 봇 토큰"
        desc: "디스코드 침입 알림 봇을 로그인시키는 열쇠(토큰)예요. 비워두면 디스코드 알림 기능 전체가 꺼져요."
        type: secret
        default: ""
        restart: true
        secret: true
        risk: medium
        verify: false

      - key: discord.alert-radius
        label: "디스코드 알림 감지 반경"
        desc: "등록한 홈에서 이 거리(블록) 안의 블록 파괴·상자 열기를 감지해서 알려줘요."
        type: float
        min: 0
        default: 30.0
        restart: true
        secret: false
        risk: low
        verify: false

      - key: discord.alert-cooldown-seconds
        label: "디스코드 알림 간격"
        desc: "같은 플레이어에게 연속으로 알림을 보내지 않는 최소 간격(초)이에요."
        type: int
        min: 0
        default: 60
        restart: true
        secret: false
        risk: low
        verify: false

      - key: activity-log.enabled
        label: "활동 기록 사용"
        desc: "접속·퇴장·채팅·명령어·사망 기록을 남길지 정해요. 거래·관리 기록은 이 값과 상관없이 항상 남아요."
        type: bool
        default: true
        restart: true
        secret: false
        risk: low
        verify: false

      - key: activity-log.retention-days
        label: "활동 기록 보관 기간"
        desc: "이 기간(일)보다 오래된 활동 기록 파일은 자동으로 지워져요. 0 이하면 안 지워요."
        type: int
        min: 0
        default: 90
        restart: true
        secret: false
        risk: low
        verify: false

      - key: activity-log.queue-limit
        label: "활동 기록 대기열 최대치"
        desc: "한 번에 기록 대기시킬 수 있는 최대 개수예요. 넘치면 서버가 멈추지 않도록 그냥 버려요."
        type: int
        min: 1
        default: 10000
        restart: true
        secret: false
        risk: low
        verify: false

      - key: web-bridge.enabled
        label: "관리자 사이트 연결 사용"
        desc: "게임 서버와 웹 관리자(gn-admin)를 잇는 통로를 켤지 정해요."
        type: bool
        default: true
        restart: true
        secret: false
        risk: high
        verify: false
        note: "바꾸면 관리자 사이트 연결이 끊길 수 있어요."

      - key: web-bridge.host
        label: "관리자 사이트 연결 주소"
        desc: "통로가 열리는 네트워크 주소예요. 보안상 127.0.0.1(이 서버 안)로만 둬야 해요."
        type: string
        max_len: 64
        default: "127.0.0.1"
        restart: true
        secret: false
        risk: high
        verify: false
        note: "바꾸면 관리자 사이트 연결이 끊길 수 있어요."

      - key: web-bridge.port
        label: "관리자 사이트 연결 포트"
        desc: "통로가 열리는 포트 번호예요."
        type: int
        min: 1
        max: 65535
        default: 25590
        restart: true
        secret: false
        risk: high
        verify: false
        note: "바꾸면 관리자 사이트 연결이 끊길 수 있어요."

      - key: web-bridge.token
        label: "관리자 사이트 연결 토큰"
        desc: "웹 백엔드가 이 통로에 접속할 때 쓰는 비밀 값이에요."
        type: secret
        default: ""
        restart: true
        secret: true
        risk: high
        verify: false
        note: "바꾸면 관리자 사이트 연결이 끊길 수 있어요."
