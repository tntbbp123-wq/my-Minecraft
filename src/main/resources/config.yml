# MyMinecraft 설정 파일

economy:
  starting-balance: 1000.0
  currency-name: "포인트"

home:
  max-homes: 5

tpa:
  request-timeout-seconds: 30

# PvP 전투 로그 방지: 다른 플레이어를 공격하거나 공격받으면 이 시간(초) 동안 "전투 중" 상태가 됩니다.
combat:
  # 전투 중에는 관리자(myminecraft.admin)를 제외한 모든 명령어 사용이 막힙니다.
  # 전투 중 상태로 접속을 종료하면 즉시 사망 처리됩니다.
  tag-seconds: 15

randomtp:
  # 중심(월드 스폰 좌표)으로부터 이 반경(블록) 안에서만 이동합니다.
  max-radius: 5000
  # 중심 기준 이 크기(가로x세로, 블록)의 정사각형 지역은 랜덤 이동 대상에서 제외됩니다.
  exclude-size: 500
  cooldown-seconds: 30
  # 안전한 착지 지점을 찾기 위한 최대 시도 횟수
  max-attempts: 30

# 실물 화폐(동전) - 주식 거래소에서 포인트 <-> 동전으로 환전 가능
currency:
  coins:
    - id: coin_1g
      value: 1
      name: "1G 동전"
      color: "6"
      material: COPPER_INGOT
      model-data: 500050
    - id: coin_10g
      value: 10
      name: "10G 동전"
      color: "7"
      material: IRON_INGOT
      model-data: 500051
    - id: coin_100g
      value: 100
      name: "100G 동전"
      color: "e"
      material: GOLD_INGOT
      model-data: 500052
    - id: coin_1000g
      value: 1000
      name: "1000G 동전"
      color: "b"
      material: DIAMOND
      model-data: 500053
    - id: coin_10000g
      value: 10000
      name: "10000G 동전"
      color: "5"
      material: NETHERITE_INGOT
      model-data: 500054

stock:
  # 주식 가격 갱신 주기(초). 서버가 꺼져있던 시간도 계산에 포함되어, 다시 켜면 밀린 만큼
  # 갱신하고 스케줄을 이어갑니다 (stockdata.yml에 마지막 갱신 시각이 저장됨).
  update-interval-seconds: 3600
  # 기본 제공 종목은 없습니다. 관리자가 /주식종류추가 로 직접 추가한 종목만 거래소에 나타납니다.
  list: []

# 관리자가 /뉴스작성, /가짜뉴스작성 으로 작성한 뉴스의 공개/반영 타이밍
news:
  # 작성 후 이 시간(초)이 지나면 주식 거래소 GUI에서 해당 종목에 커서를 올렸을 때 보이기 시작합니다.
  reveal-delay-seconds: 3600
  # 작성 후 이 시간(초)이 지나면 (가짜 뉴스가 아닌 경우) 실제로 해당 종목 가격에 반영됩니다.
  apply-delay-seconds: 7200
  # AI가 등락 방향/변동폭을 직접 정할 때(예: /뉴스작성 <종목명> AI:<주제>) 허용되는 변동폭(%) 범위.
  ai-min-magnitude-percent: 1.0
  ai-max-magnitude-percent: 10.0

# 뉴스 작성 시 "AI:주제" 형식으로 입력하면 아래 AI API로 기사 본문을 자동 생성합니다.
# Google AI Studio(https://aistudio.google.com/)에서 무료로 Gemini API 키를 발급받아 넣으세요.
ai:
  enabled: false
  provider: "gemini"
  api-key: ""
  model: "gemini-2.5-flash"

enhance:
  # 강화석 아이콘 재질 (전용 아이템이며, /특수아이템소환 <유저> 강화석 <수량> 으로 지급)
  material: AMETHYST_SHARD
  # resourcepack/ 의 커스텀 텍스처와 연결되는 CustomModelData 값 (리소스팩 미적용 서버에서는 무시되고 기본 아이콘으로 보임)
  model-data: 500001
  # 강화 GUI 진행 표시(0➜+1 ~ 9➜+10)에 쓰이는 CustomModelData 시작값. resourcepack/에 레벨별로
  # 10개(model-data ~ model-data+9)가 미리 준비되어 있음. 리소스팩 미적용 시 기본 화살표 아이콘으로 보임.
  progress-model-data-base: 500040
  # 확률 강화 두루마리 등급 목록 (전용 아이템이며, /특수아이템소환 <유저> <등급>두루마리 <수량> 으로 지급)
  scrolls:
    - id: common
      name: "일반등급 두루마리"
      material: PAPER
      color: f
      model-data: 500010
      bonus-percent: 10.0
    - id: rare
      name: "레어등급 두루마리"
      material: PAPER
      color: 9
      model-data: 500011
      bonus-percent: 20.0
    - id: epic
      name: "에픽등급 두루마리"
      material: PAPER
      color: 5
      model-data: 500012
      bonus-percent: 30.0
    - id: legendary
      name: "레전더리등급 두루마리"
      material: PAPER
      color: 6
      model-data: 500013
      bonus-percent: 45.0
  base-success-percent: 100.0
  decrease-per-level: 8.0
  min-success-percent: 15.0
  max-level: 10
  base-cost: 100.0
  cost-per-level: 50.0

# 신화 등급 무기 '레바테인' (/특수아이템소환 <유저> 레바테인 <수량> 으로 지급)
laevateinn:
  # resourcepack/ 의 커스텀 텍스처와 연결되는 CustomModelData 값 (리소스팩 미적용 서버에서는 무시되고 네더라이트 검 기본 아이콘으로 보임)
  model-data: 500020
  # 근접 공격력 (툴팁/실제 데미지 계산에 쓰이는 최종 공격력 수치)
  attack-damage: 12.0
  # 지옥의 화상 상태에서 치유 효과 감소율(%)
  heal-reduction-percent: 50.0
  # 이 시간(틱, 20틱=1초) 이상 연속으로 물에 젖어 있으면 지옥의 화상이 해제됩니다.
  water-extinguish-ticks: 60
  # 공격 적중 시 부여되는 지옥의 화상
  onhit:
    burn-duration-seconds: 6
    burn-damage-per-second: 3.0
  # 라그나로크의 숨결 (F키 발동)
  ability:
    cooldown-seconds: 120
    range: 8.0
    cone-angle-degrees: 80.0
    damage: 20.0
    launch-power: 1.0
    burn-duration-seconds: 10
    burn-damage-per-second: 4.0
    magma-duration-seconds: 8
