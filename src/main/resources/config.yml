# MyMinecraft 설정 파일

economy:
  starting-balance: 1000.0
  currency-name: "포인트"

home:
  max-homes: 5

tpa:
  request-timeout-seconds: 30

randomtp:
  # 중심(월드 스폰 좌표)으로부터 이 반경(블록) 안에서만 이동합니다.
  max-radius: 5000
  # 중심 기준 이 크기(가로x세로, 블록)의 정사각형 지역은 랜덤 이동 대상에서 제외됩니다.
  exclude-size: 500
  cooldown-seconds: 30
  # 안전한 착지 지점을 찾기 위한 최대 시도 횟수
  max-attempts: 30

stock:
  update-interval-seconds: 300
  list:
    - id: apple
      name: "애플전자"
      material: GOLD_INGOT
      price: 100.0
      min-price: 10.0
      max-change-percent: 8.0
    - id: gold
      name: "골드마이닝"
      material: GOLD_NUGGET
      price: 250.0
      min-price: 20.0
      max-change-percent: 12.0
    - id: diamond
      name: "다이아산업"
      material: DIAMOND
      price: 500.0
      min-price: 50.0
      max-change-percent: 10.0
    - id: nether
      name: "네더에너지"
      material: BLAZE_POWDER
      price: 150.0
      min-price: 15.0
      max-change-percent: 15.0

enhance:
  # 강화석 아이콘 재질 (전용 아이템이며, /enhanceitem stone <player> 로 지급)
  material: AMETHYST_SHARD
  # resourcepack/ 의 커스텀 텍스처와 연결되는 CustomModelData 값 (리소스팩 미적용 서버에서는 무시되고 기본 아이콘으로 보임)
  model-data: 500001
  # 확률 강화 두루마리 등급 목록 (전용 아이템이며, /enhanceitem scroll:<id> <player> 로 지급)
  scrolls:
    - id: common
      name: "일반등급 두루마리"
      material: PAPER
      color: f
      model-data: 500010
      bonus-percent: 10.0
    - id: rare
      name: "레어등급 두루마리"
      material: PAPER
      color: 9
      model-data: 500011
      bonus-percent: 20.0
    - id: epic
      name: "에픽등급 두루마리"
      material: PAPER
      color: 5
      model-data: 500012
      bonus-percent: 30.0
    - id: legendary
      name: "레전더리등급 두루마리"
      material: PAPER
      color: 6
      model-data: 500013
      bonus-percent: 45.0
  base-success-percent: 100.0
  decrease-per-level: 8.0
  min-success-percent: 15.0
  max-level: 10
  base-cost: 100.0
  cost-per-level: 50.0

# 신화 등급 무기 '레바테인' (/laevateinn <player> 로 지급)
laevateinn:
  # resourcepack/ 의 커스텀 텍스처와 연결되는 CustomModelData 값 (리소스팩 미적용 서버에서는 무시되고 네더라이트 검 기본 아이콘으로 보임)
  model-data: 500020
  # 지옥의 화상 상태에서 치유 효과 감소율(%)
  heal-reduction-percent: 50.0
  # 이 시간(틱, 20틱=1초) 이상 연속으로 물에 젖어 있으면 지옥의 화상이 해제됩니다.
  water-extinguish-ticks: 60
  # 공격 적중 시 부여되는 지옥의 화상
  onhit:
    burn-duration-seconds: 6
    burn-damage-per-second: 3.0
  # 라그나로크의 숨결 (F키 발동)
  ability:
    cooldown-seconds: 120
    range: 8.0
    cone-angle-degrees: 80.0
    damage: 20.0
    launch-power: 1.0
    burn-duration-seconds: 10
    burn-damage-per-second: 4.0
    magma-duration-seconds: 8

# 서버/월드 선택 로비 메뉴 (/serverselect 로 열기)
worldselect:
  title: "서버 선택"
  page-size: 7
  entries:
    - id: dungeon
      name: "던전"
      name-color: 6
      tag: "DG"
      tag-color: c
      material: NETHER_BRICKS
      # 이동할 Multiverse 월드 이름 (없으면 클릭 시 안내 메시지만 표시)
      world: dungeon
      extra-lines:
        - "§c해당 서버는 컨텐츠 서버입니다."
        - "§c처음 오신 분들은, 좌/우측에 있는"
        - "§c야생, 마인팜 중 하나를 선택하세요."
    - id: ice
      name: "아이스"
      name-color: b
      tag: "ICE"
      tag-color: 9
      material: PACKED_ICE
      world: ice
      extra-lines: []
    - id: survival
      name: "야생"
      name-color: a
      tag: "SV"
      tag-color: 2
      material: GRASS_BLOCK
      world: world
      extra-lines: []
    - id: minefarm
      name: "마인팜"
      name-color: e
      tag: "MF"
      tag-color: 6
      material: IRON_PICKAXE
      world: minefarm
      extra-lines: []
