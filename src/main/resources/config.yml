# 전설 등급 무기 '말룡도(末龍刀)' — 종말룡 엔더드래곤을 잡으면 확률로 떨어진다.
# 단계별 연계 무기라 1초식 적중 -> 2초식 -> 3초식 순서로만 쓸 수 있다.
malyongdo:
  # resourcepack/ 의 커스텀 텍스처와 연결되는 CustomModelData 값 (0이면 붙이지 않음)
  model-data: 0
  attack-damage: 12.0
  # 종말룡 처치 시 떨어질 확률(%). 마지막 일격을 넣은 사람에게 우편으로 간다.
  drop-chance-percent: 10.0
  # 앞 초식을 쓴 뒤 다음 초식이 열려 있는 시간(초). 지나면 1초식부터 다시 시작한다.
  combo-window-seconds: 10
  # '말' 자원
  stack:
    max: 100
    # 때릴 때마다 오르는 양
    per-hit: 1.0
    # 들고 있기만 해도 초당 오르는 양
    per-second: 0.5
  # [F] 1초식 말 - 말을 조금 쓰고 전방을 내리벤다. 적중해야 2초식이 열린다.
  first:
    cooldown-seconds: 6
    stack-cost: 20
    damage: 12.0
    range: 5.0
    cone-angle-degrees: 80.0
  # [웅크리기+F] 2초식 말룡 - 남은 말을 전부 쏟는다. 피해와 방어관통이 소모한 말에 비례한다.
  second:
    cooldown-seconds: 20
    # 말 1개당 피해
    damage-per-stack: 0.35
    # 말을 가득(stack.max) 채웠을 때의 방어관통(%)
    max-penetration-percent: 30.0
    fire-ticks: 60
    range: 9.0
    cone-angle-degrees: 60.0
  # [웅크리기+우클릭] 3초식 종말룡 - 화신 상태로 들어갔다가 끝날 때 쌓인 파괴력을 쏟아낸다.
  third:
    cooldown-seconds: 90
    # 시전에 필요한 최소 말 (가진 말은 전부 소모된다)
    min-stacks: 50
    avatar-seconds: 5
    # 소모한 말 1개당 시작 파괴력
    power-per-stack: 0.4
    # 화신 동안 입힌 피해가 파괴력으로 쌓이는 비율 (1.0 = 입힌 만큼 그대로)
    power-ratio: 1.0
    fire-ticks: 100
    range: 12.0
    cone-angle-degrees: 70.0

# 현상금 표식 (Mark of Bounty) — 한 사람이 다른 한 사람에게만 찍을 수 있는 개인 표식.
# 표식을 받은 쪽은 받는 피해와 주는 피해가 같이 늘어난다 (하이 리스크 하이 리턴).
bounty:
  enabled: true
  # 표식 1개당 받는 피해 증가(%)
  damage-taken-percent-per-mark: 0.4
  # 표식 1개당 주는 피해 증가(%)
  damage-dealt-percent-per-mark: 0.5
  # 표식을 옮기고 나서 다시 옮길 수 있을 때까지의 시간(초). 0이면 제한 없음.
  change-cooldown-seconds: 3600

# 신화 등급 무기 '드라켄피어스' (/특수아이템소환 <유저> 드라켄피어스 <수량> 으로 지급)
draken-pierce:
  # resourcepack/ 의 커스텀 텍스처와 연결되는 CustomModelData 값 (리소스팩 미적용 서버에서는 무시되고 삼지창 기본 아이콘으로 보임)
  model-data: 500021
  # 근접 공격력 (툴팁/실제 데미지 계산에 쓰이는 최종 공격력 수치)
  attack-damage: 11.0
  # 항상 적용되는 고정 방어관통(%). 스타포스로 붙인 방어관통과는 별개로 중첩 적용됨
  defense-penetration-percent: 45.0
  # 감전(둔화) 디버프 공통 설정
  shock:
    # 둔화(Slowness) 효과 단계 (0 = 둔화 I)
    slow-amplifier: 1
  # 드라켄 라이트닝 (F키 발동) - 전방 적을 맞히면 번개가 주변으로 연쇄
  lightning:
    cooldown-seconds: 20
    range: 10.0
    cone-angle-degrees: 50.0
    damage: 9.0
    # 최초 적중 대상 기준, 추가로 연쇄되는 최대 인원
    chain-count: 3
    # 연쇄가 다음 대상을 찾는 반경(블록)
    chain-radius: 4.0
    # 연쇄로 옮겨붙을 때마다 적용되는 피해 배율 (최초 적중 대비)
    chain-damage-multiplier: 0.6
    shock-duration-seconds: 5
    shock-damage-per-second: 2.5
  # 드라코닉 메타모포시스 (웅크리기+F 발동) - 번개 폭발 후 쌍단검으로 일시 변형
  metamorphosis:
    cooldown-seconds: 25
    # 변형 지속시간(초). 이동속도/공격속도 상승도 이 시간 동안 유지됨
    duration-seconds: 7
    # 변형 중 무기에 적용되는 CustomModelData (리소스팩 미적용 서버/전용 텍스처 미포함 시 원래 모습 그대로 보임)
    model-data: 500022
    # 발동 시 전방 번개 폭발의 범위/각도/피해
    burst-range: 4.0
    burst-cone-angle-degrees: 140.0
    burst-damage: 6.0
    shock-duration-seconds: 4
    shock-damage-per-second: 2.0
    # 변형 중 이동속도 효과 단계 (0 = 신속 I)
    speed-amplifier: 2
    # 변형 중 무기에 임시로 더해지는 공격속도 수치
    attack-speed-bonus: 0.6

# 레이드 보스. /레이드보스 소환 <보스ID> 로 관리자가 직접 소환한다.
raid-boss:
  # '끝없는 기사' - 체력이 0이 되면 죽는 대신 쓰러지고, 주변에 떨어지는 '영혼의 파편'을
  # knockdown.duration-seconds 안에 전부 파괴해야만 진짜로 처치된다. 못 부수면 검기를
  # 방출하며 체력을 모두 회복하고 부활한다 (페이즈 반복).
  eternal-knight:
    max-health: 600.0
    # 패턴이 대상을 탐색하는 반경(블록)
    engage-range: 24.0
    # 불멸의 의지 - 체력이 닳을수록, 그리고 부활할수록 이동속도/공격력이 상승한다.
    will:
      base-movement-speed: 0.28
      movement-speed-per-lost-ratio: 0.12
      movement-speed-per-knockdown: 0.03
      base-attack-damage: 9.0
      attack-damage-per-lost-ratio: 6.0
      attack-damage-per-knockdown: 2.0
    # 연속 참격 - 전방 부채꼴을 빠르게 연타한다.
    combo:
      cooldown-seconds: 8
      strike-count: 5
      strike-interval-ticks: 5
      range: 4.5
      cone-angle-degrees: 100.0
      damage-per-strike: 5.0
    # 반격 태세 - 자세를 잡는 동안 근접 공격을 하면 카운터 피해와 스턴이 돌아온다.
    counter:
      cooldown-seconds: 18
      duration-seconds: 4
      damage: 14.0
      stun-seconds: 2
    # 처형자의 돌진 - 일직선으로 돌진하며 경로상 대상의 방패를 사용 불가로 만든다.
    charge:
      cooldown-seconds: 12
      speed: 1.6
      duration-ticks: 20
      hit-radius: 2.5
      damage: 12.0
      shield-disable-seconds: 5
    # 불사의 육체 / 영혼의 파편 (처치 기믹)
    knockdown:
      duration-seconds: 6
      fragment-count: 4
      fragment-radius: 4.0
      revive-wave-radius: 6.0
      revive-wave-damage: 16.0

  # '기억할 수 없는 자' - 인지를 오염시키는 보스. 정면에서 눈을 마주보고 있으면 사고가
  # 정지되므로, 화면을 돌린 채 측면이나 후방에서 공격해야 한다.
  # 원안의 "미니맵/UI 지우기"는 서버가 클라이언트 화면을 건드릴 수 없어 그대로는 구현할 수 없고,
  # 암전(실명+어둠)과 닉네임 숨김으로 대체했다.
  oblivion:
    max-health: 700.0
    attack-damage: 10.0
    engage-range: 24.0
    # 정신 붕괴의 응시 (패시브)
    gaze:
      # 이 거리(블록) 안에서만 판정한다
      range: 8.0
      # 이 시간(초) 이상 연속으로 직시하면 사고 정지에 빠진다
      required-seconds: 1.5
      # 플레이어의 시선이 보스를 향한 것으로 볼 각도. 좁을수록 "정확히 쳐다봐야" 걸린다
      player-angle-degrees: 40.0
      # 보스의 정면으로 볼 각도. 이 범위 밖(측면/후방)에 있으면 아무리 봐도 걸리지 않는다
      boss-front-angle-degrees: 120.0
      # 사고 정지 지속시간(초) - 이동/명령어/채팅/스킬이 전부 막히고 암전된다
      mind-break-seconds: 3
      # 사고 정지 중 초당 피해
      damage-per-second: 4.0
    # 기억 소거의 파동 (액티브) - 주변 플레이어의 핫바 아이템을 일시적으로 쓸 수 없게 만든다
    wave:
      cooldown-seconds: 20
      radius: 15.0
      seal-seconds: 5
    # 존재의 망각 (궁극기) - 체력이 이 비율 이하로 떨어지면 발동해 끝까지 유지된다
    ultimate:
      health-threshold: 0.5
      radius: 20.0
      darkness-refresh-seconds: 3

  # '종말룡 엔더드래곤' - 규격 외 스펙의 파괴신형 보스.
  # 바닐라 엔더드래곤 AI는 엔드의 출구 포탈을 찾아다니도록 만들어져 있어 다른 월드에서는
  # 원점(0,0) 쪽으로 날아가 버린다. 그래서 AI를 끄고 플러그인이 위치와 패턴을 직접 조종한다.
  # 낙하 지점의 지형은 일부러 파괴하지 않는다 (월드를 되돌릴 수 없게 망가뜨리지 않기 위해).
  apocalypse-dragon:
    max-health: 1200.0
    attack-damage: 15.0
    engage-range: 40.0
    # 지면으로부터 떠 있는 높이(블록)
    hover-height: 7.0
    # 한 번의 판정(0.5초)마다 이동하는 거리(블록). 높이면 더 빠르게 따라붙는다
    move-speed: 1.2
    # 종말의 포효 (패시브) - 방어력을 무시하는 상시 피해와 넉백
    roar:
      radius: 20.0
      # 0.5초마다 들어가는 방어무시 피해
      damage-per-tick: 1.5
      # 공중으로 밀어올리는 세기
      lift: 0.25
    # 멸망의 브레스 - 전방 부채꼴 화염. 방어구 내구도를 크게 깎는다
    breath:
      cooldown-seconds: 15
      range: 18.0
      cone-angle-degrees: 70.0
      damage: 18.0
      fire-ticks: 120
      # 방어구에 주는 내구도 피해. 장비가 완전히 사라지지는 않고 내구도 1은 남는다
      armor-damage: 200
    # 천공의 추락 - 체력 75%/50%/25%에서 한 번씩 발동
    dive:
      rise-height: 25.0
      # 착지 지점을 미리 보여주는 시간(틱). 이 시간 안에 피해야 한다
      telegraph-ticks: 40
      shockwave-radius: 8.0
      shockwave-damage: 30.0
      knock-up: 1.4
    # 공간 분할 (궁극기) - 체력이 이 비율 이하가 되면 균열이 열리고 회복이 차단된다
    rift:
      health-threshold: 0.3
      count: 8
      # 균열이 생성되는 범위(블록, 소환 지점 기준)
      spread: 25.0
      # 균열 하나의 반경과 피해
      radius: 3.0
      damage: 3.0
      # 이 거리 안에 있는 플레이어는 회복이 차단된다
      heal-block-radius: 30.0

# 신화 등급 구속 무기 '글레이프니르' (/특수아이템소환 <유저> 글레이프니르 <수량> 으로 지급)
# 공격력이 0인 대신 상대의 행동 자체를 묶는 무기다.
gleipnir:
  # resourcepack/ 의 커스텀 텍스처와 연결되는 CustomModelData 값 (미적용 시 끈 기본 아이콘)
  model-data: 500023
  # 스킬이 대상을 찾는 거리(블록)와 전방 판정 각도
  range: 12.0
  cone-angle-degrees: 40.0
  # [F] 봉인 - 대상의 스킬/특수능력을 사용할 수 없게 만든다
  seal:
    cooldown-seconds: 120
    duration-seconds: 20
  # [Q] 속박 - 대상의 이동을 묶는다. 방어력이 높을수록 오래 묶인다
  #   지속시간(초) = base-seconds + (대상 방어력 * seconds-per-armor), 최대 max-seconds
  #   예) 풀 다이아 방어구(방어력 20) 기준 3 + 20*0.4 = 11초
  bind:
    cooldown-seconds: 180
    base-seconds: 3.0
    seconds-per-armor: 0.4
    max-seconds: 15.0
  # [L] 절대봉인 - 아이템을 소모해 대상을 일정 시간 서버에서 차단한다.
  #
  # 주의: 되돌리기 어려운 강력한 효과다. 플레이어가 다른 플레이어를 게임에서 쫓아낼 수 있으므로
  # 아래 안전장치가 걸려 있다.
  #   - OP에게는 통하지 않는다
  #   - 사용 시 콘솔 로그와 전체 공지가 남아 누가 누구에게 썼는지 추적할 수 있다
  #   - 아이템은 /특수아이템소환 으로만 지급된다 (제작 불가)
  # 부담스러우면 enabled를 false로 두면 된다. 봉인(F)과 속박(Q)은 그대로 동작한다.
  absolute-seal:
    enabled: true
    ban-seconds: 600

# 코어 (팀 거점 겸 상점). 신호기(Beacon)를 변형해 만들어져 있어, 제작한 뒤 바닥에 설치하면
# 실제 신호기 블록이 되고 그 위치가 설치한 사람의 팀 거점(홈)이 된다. 우클릭하면 바닐라
# 신호기 GUI 대신 전용 상점 GUI가 열린다. 제작법: 네더별-드래곤의 숨결-네더별 /
# 바다의 심장-유리-바다의 심장 / 철블럭-철블럭-철블럭 (3x3, 신호기와 유사한 배치).
# /팀생성 으로 팀을 만들면 팀장에게 코어 1개가 자동 지급된다.
core:
  # resourcepack/ 의 커스텀 텍스처와 연결되는 CustomModelData 값 (리소스팩 미적용 서버에서는 무시되고 신호기 기본 아이콘으로 보임)
  model-data: 500040
  # 상점에서 아이템을 살 때 차감되는 포인트(economy.starting-balance와 같은 재화) 가격.
  # 키는 /특수아이템소환 과 동일한 아이템명을 사용한다.
  shop:
    prices:
      강화석: 50.0
      별가루: 80.0
      일반두루마리: 100.0
      레어두루마리: 250.0
      에픽두루마리: 600.0
      레전더리두루마리: 1500.0
      일괄약탈주문서: 300.0
      함정설치키트: 200.0
      화염병: 80.0
      연막탄: 60.0
      밀도나침반: 150.0
      발자국추적기: 150.0
      혈흔나침반: 200.0
      소음차단포션: 120.0
