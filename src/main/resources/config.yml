# MyMinecraft 설정 파일

economy:
  starting-balance: 1000.0
  currency-name: "G"

# 웹 관리자(gn-admin) 연결 통로. 게임 서버 안에서 127.0.0.1 에만 열리고, 같은 서버의 웹 백엔드만 접속한다.
web-bridge:
  enabled: true
  # 보안상 127.0.0.1 외의 주소를 적어도 127.0.0.1 에만 연다.
  host: "127.0.0.1"
  port: 25590
  # 토큰은 env:GN_BRIDGE_TOKEN 권장 (root 전용 /etc/gn-test/bridge.env → EnvironmentFile)
  # 토큰을 풀 수 없으면(환경변수 없음 등) 통로를 열지 않고 경고만 남긴다. 다른 기능은 그대로 동작한다.
  token: "env:GN_BRIDGE_TOKEN"
  threads: 2
  max-body-bytes: 65536
  # 메인 스레드가 이 시간(ms) 안에 요청 작업을 시작하지 못하면 504로 거절한다(실행되지 않음).
  sync-timeout-ms: 5000
  save-timeout-ms: 30000
  # 같은 X-Request-Id 요청의 응답을 보관해 재시도 시 중복 실행을 막는 시간(초)
  idempotency-ttl-seconds: 600

# 활동/거래/관리 기록 (plugins/MyMinecraft/logs/<activity|trade|admin>-YYYY-MM-DD.jsonl, UTC 날짜)
activity-log:
  # 접속/퇴장/채팅/명령어/사망 기록(activity) 여부. 거래(trade)·관리(admin) 기록은 이 값과 관계없이 남는다.
  enabled: true
  chat: true
  commands: true
  # 인자를 *** 로 가릴 명령 첫 토큰 목록
  redact-commands: ["디스코드연동확인", "디스코드연동"]
  # 기록 대기열 최대 개수. 넘치면 서버를 멈추지 않도록 버리고 개수만 admin 기록(log_dropped)에 남긴다.
  queue-limit: 10000
  # 이 기간(일)보다 오래된 기록 파일은 자동 삭제 (0 이하면 삭제 안 함)
  retention-days: 90

home:
  max-homes: 5

# 우편 (/우편함, 메뉴의 우편함 버튼, 웹 관리자 아이템 지급). 우편은 plugins/MyMinecraft/mail/<uuid>.yml 에 저장된다.
mail:
  # 일반(시스템·퀘스트) 우편 보관 기간(일)과 우편함 최대 개수 — 기획서 06 §4.6. 가득 차면 새 우편은 보류하고 알린다.
  regular-retention-days: 7
  regular-max-count: 50
  # 관리자(웹) 우편 기본 보관 기간(일). 관리자 우편은 위 최대 개수에 포함되지 않는다.
  admin-retention-days: 30
  # 관리자 우편에도 안전상 절대 상한을 둘지(받지 않은 우편 전체 수 기준, 0=무제한). 기본 무제한(상한 제외).
  admin-max-count: 0
  # 퀘스트 보상 등 지연 발송 대기열의 발송 간격(틱, 20틱=1초). 웹 단건 발송에는 영향 없음(기획서 06: 3초).
  send-batch-delay-ticks: 60

tpa:
  request-timeout-seconds: 30

# PvP 전투 로그 방지: 다른 플레이어를 공격하거나 공격받으면 이 시간(초) 동안 "전투 중" 상태가 됩니다.
combat:
  # 전투 중에는 관리자(myminecraft.admin)를 제외한 모든 명령어 사용이 막힙니다.
  # 전투 중 상태로 접속을 종료하면 즉시 사망 처리됩니다.
  tag-seconds: 45
  # 전투 태그가 걸려 있는 동안 전투 음악을 재생한다. 소리가 플레이어를 따라다니므로
  # 도망쳐도 끊기지 않는다.
  # 음원은 저작권 때문에 저장소에 포함되어 있지 않다. README의 "전투 음악" 항목을 보고
  # 리소스팩에 직접 넣은 뒤 enabled를 true로 바꿔야 소리가 난다.
  # 리소스팩을 적용하지 않은 플레이어에게는 아무 소리도 안 날 뿐 다른 영향은 없다.
  music:
    enabled: false
    # 리소스팩 sounds.json에 등록한 사운드 이름
    sound: "myminecraft:music.combat"
    # 트랙 길이(초). 전투가 이보다 길어지면 다시 처음부터 재생해 끊기지 않게 한다.
    track-length-seconds: 142
    volume: 0.7

randomtp:
  # 중심(월드 스폰 좌표)으로부터 이 반경(블록) 안에서만 이동합니다.
  max-radius: 5000
  # 중심 기준 이 크기(가로x세로, 블록)의 정사각형 지역은 랜덤 이동 대상에서 제외됩니다.
  exclude-size: 500
  cooldown-seconds: 30
  # 안전한 착지 지점을 찾기 위한 최대 시도 횟수
  max-attempts: 30

# 실물 화폐(동전) - 주식 거래소에서 포인트 <-> 동전으로 환전 가능
currency:
  coins:
    - id: coin_1g
      value: 1
      name: "1G 동전"
      color: "6"
      material: COPPER_INGOT
      model-data: 500050
    - id: coin_10g
      value: 10
      name: "10G 동전"
      color: "7"
      material: IRON_INGOT
      model-data: 500051
    - id: coin_100g
      value: 100
      name: "100G 동전"
      color: "e"
      material: GOLD_INGOT
      model-data: 500052
    - id: coin_1000g
      value: 1000
      name: "1000G 동전"
      color: "b"
      material: DIAMOND
      model-data: 500053
    - id: coin_10000g
      value: 10000
      name: "10000G 동전"
      color: "5"
      material: NETHERITE_INGOT
      model-data: 500054

stock:
  # 주식 가격 갱신 주기(초). 서버가 꺼져있던 시간도 계산에 포함되어, 다시 켜면 밀린 만큼
  # 갱신하고 스케줄을 이어갑니다 (stockdata.yml에 마지막 갱신 시각이 저장됨).
  update-interval-seconds: 3600
  # 기본 제공 종목은 없습니다. 관리자가 /주식종류추가 로 직접 추가한 종목만 거래소에 나타납니다.
  list: []

# 관리자가 /뉴스작성, /가짜뉴스작성 으로 작성한 뉴스의 공개/반영 타이밍
news:
  # 작성 후 이 시간(초)이 지나면 주식 거래소 GUI에서 해당 종목에 커서를 올렸을 때 보이기 시작합니다.
  reveal-delay-seconds: 3600
  # 작성 후 이 시간(초)이 지나면 (가짜 뉴스가 아닌 경우) 실제로 해당 종목 가격에 반영됩니다.
  apply-delay-seconds: 7200
  # AI가 등락 방향/변동폭을 직접 정할 때(예: /뉴스작성 <종목명> AI:<주제>) 허용되는 변동폭(%) 범위.
  ai-min-magnitude-percent: 1.0
  ai-max-magnitude-percent: 10.0

# 뉴스 작성 시 "AI:주제" 형식으로 입력하면 아래 AI API로 기사 본문을 자동 생성합니다.
# Google AI Studio(https://aistudio.google.com/)에서 무료로 Gemini API 키를 발급받아 넣으세요.
ai:
  enabled: false
  provider: "gemini"
  # 디스코드 봇 토큰과 같은 형식을 지원한다.
  #   "실제키"            - 평문 그대로
  #   "env:이름"          - 환경변수에서 읽음 (값이 어느 파일에도 남지 않아 가장 안전)
  #   "file:/경로/파일"   - 다른 파일에서 읽음
  #   "enc:..."           - plugins/MyMinecraft/secret.key 로 복호화
  # API 키는 요금이 청구될 수 있으니 유출되지 않게 주의하고, 새어나갔다면 즉시 폐기·재발급하세요.
  api-key: ""
  model: "gemini-2.5-flash"

enhance:
  # 강화석 아이콘 재질 (전용 아이템이며, /특수아이템소환 <유저> 강화석 <수량> 으로 지급)
  material: AMETHYST_SHARD
  # resourcepack/ 의 커스텀 텍스처와 연결되는 CustomModelData 값 (리소스팩 미적용 서버에서는 무시되고 기본 아이콘으로 보임)
  model-data: 500001
  # 강화 GUI 진행 표시(0➜+1 ~ 9➜+10)에 쓰이는 CustomModelData 시작값. resourcepack/에 레벨별로
  # 10개(model-data ~ model-data+9)가 미리 준비되어 있음. 리소스팩 미적용 시 기본 화살표 아이콘으로 보임.
  progress-model-data-base: 500040
  # 확률 강화 두루마리 등급 목록 (전용 아이템이며, /특수아이템소환 <유저> <등급>두루마리 <수량> 으로 지급)
  scrolls:
    - id: common
      name: "일반등급 두루마리"
      material: PAPER
      color: f
      model-data: 500010
      bonus-percent: 10.0
    - id: rare
      name: "레어등급 두루마리"
      material: PAPER
      color: 9
      model-data: 500011
      bonus-percent: 20.0
    - id: epic
      name: "에픽등급 두루마리"
      material: PAPER
      color: 5
      model-data: 500012
      bonus-percent: 30.0
    - id: legendary
      name: "레전더리등급 두루마리"
      material: PAPER
      color: 6
      model-data: 500013
      bonus-percent: 45.0
  # 성공 확률: guaranteed-level강까지는 base-success-percent로 무조건 성공하고, 그 이후로는
  # 한 단계 강화할 때마다 직전 확률에 decay-multiplier를 곱해 감소한다 (기본: 0강~4강 100%,
  # 5강부터 직전 확률의 80%씩 — 10강 26.214% / 15강 8.590% / 20강 2.815% / 30강 0.302%).
  # 계산된 확률이 min-success-percent보다 낮아지면 그 값으로 고정된다.
  base-success-percent: 100.0
  guaranteed-level: 4
  decay-multiplier: 0.8
  min-success-percent: 0.001
  # 기본 강화 한계치. <초월의 제단>에서 초월한 장비는 transcended-max-level까지 강화 가능.
  max-level: 20
  transcended-max-level: 30
  base-cost: 100.0
  cost-per-level: 50.0
  # 무기(검/도끼/삼지창/활/철퇴 등) 강화 시 레벨당 상승하는 기본 공격력/공격속도
  attack-damage-per-level: 0.5
  attack-speed-per-level: 0.02

# 스타포스 (/특수아이템소환 <유저> 별가루 <수량> 으로 지급). 별가루를 소모해 무기에 '성'을
# 붙이며, 성 개수당 방어관통(%)이 오른다. 10성을 달성하면 무기 종류별 특수 능력이 열린다
# (10성 특수 능력 자체는 다음 업데이트에서 구현 예정).
starforce:
  # 별가루 아이콘 재질 (전용 아이템)
  material: GLOWSTONE_DUST
  # resourcepack/ 의 커스텀 텍스처와 연결되는 CustomModelData 값 (리소스팩 미적용 서버에서는 무시되고 기본 아이콘으로 보임)
  model-data: 500003
  # 성 1개를 붙일 때마다 소모되는 별가루 개수
  stardust-per-star: 1
  # 최대 별(성) 개수
  max-stars: 10
  # 별 1개당 상승하는 방어관통 수치(%). 최대 별 개수를 곱한 값이 상한.
  defense-penetration-per-star: 3.0

# 초월의 제단을 실제 블록처럼 세계에 세울 때 쓰는 설정 (/초월제단설치 명령어로 설치).
# 진짜 새 블록 타입을 만들 수는 없어서 ItemDisplay 엔티티로 떠 있는 아이템을 보여주는 방식이며,
# 오른쪽 클릭하면 초월의 제단 GUI가 열린다.
transcend-altar:
  # 표시 아이템 기본 재질 (커스텀 텍스처가 없어도 그럴듯하게 보이도록 기본은 END_CRYSTAL)
  material: END_CRYSTAL
  # resourcepack/ 의 커스텀 텍스처와 연결되는 CustomModelData 값 (리소스팩 미적용 서버에서는 기본 아이콘으로 보임)
  model-data: 500030
  # 표시 크기 배율
  scale: 1.5

# 암시장 아이템.
# /특수아이템소환 <유저> <아이템명> <수량> 으로 지급 (아이템명은 위 각 항목 참고).
blackmarket:
  loot-all-scroll:
    material: PAPER
    model-data: 500050
  trap-kit:
    material: TRIPWIRE_HOOK
    model-data: 500051
    # DEBUFF: 강한 독+위더 디버프 부여 / TNT: 강한 폭발(TNT) 즉시 발동
    mode: DEBUFF
    poison-duration-seconds: 10
    wither-duration-seconds: 10
  molotov:
    material: SPLASH_POTION
    model-data: 500052
    # 착탄 지점 발화/생물 발화 반경(블록)
    radius: 3.0
    # 착탄 시 근처 생물에게 붙는 불(틱, 20틱=1초)
    entity-fire-ticks: 100
  smoke-bomb:
    material: SPLASH_POTION
    model-data: 500053
    # 연막(실명 효과) 반경(블록)
    radius: 4.0
    # 연막 지속시간(틱, 20틱=1초)
    duration-ticks: 100
  density-compass:
    material: COMPASS
    model-data: 500054
    # 스캔 반경(블록). 로드된 청크만 검사함
    radius: 64
    # 재사용 대기시간(초)
    cooldown-seconds: 30
  footprint-tracker:
    material: ARROW
    model-data: 500055
    # 흔적이 남는 시간(틱, 20틱=1초)
    duration-ticks: 3600
  blood-compass:
    material: COMPASS
    model-data: 500056
    # 실제 위치에서 무작위로 어긋나게 하는 반경(블록) — "대략적인" 위치를 표현하기 위함
    jitter-radius: 20.0
  silence-potion:
    material: POTION
    model-data: 500057
    # 효과 지속시간(틱, 20틱=1초)
    duration-ticks: 600

# 디스코드 침입 알림 (암시장 마지막 기능). 아래 bot-token을 채워야 활성화됨.
# 1. https://discord.com/developers/applications 에서 애플리케이션+봇을 만들고 토큰을 발급받는다.
# 2. 봇을 자신의 디스코드 서버에 초대한다 (OAuth2 URL Generator에서 bot 스코프 선택).
# 3. 알림을 받을 플레이어는 그 서버에 들어가 있어야 하고, 게임에서 /디스코드연동 <디스코드ID>로
#    인증 코드를 DM으로 받은 뒤 /디스코드연동확인 <코드>로 연동을 완료해야 한다.
# 연동한 플레이어가 /홈설정 으로 등록해둔 홈 근처(alert-radius)에서 다른 플레이어가 블록을
# 부수거나 상자류를 열면 디스코드 DM으로 알림이 온다. bot-token이 비어있으면 이 기능 전체가
# 비활성화되고 나머지 플러그인 기능에는 영향이 없다.
discord:
  # 토큰은 아래 네 가지 형식 중 하나로 적을 수 있다.
  #   "실제토큰"          - 평문 그대로 (간단하지만 config를 보는 사람에게 그대로 노출됨)
  #   "env:이름"          - 환경변수에서 읽음. 값이 어느 파일에도 남지 않아 가장 안전하다.
  #   "file:/경로/파일"   - 다른 파일에서 읽음. config를 통째로 보여줘도 값은 노출되지 않는다.
  #   "enc:..."           - plugins/MyMinecraft/secret.key 로 복호화. 평문을 적어둔 뒤
  #                         게임에서 /토큰암호화 를 실행하면 바꿀 값을 알려준다.
  # 주의: enc: 는 암호화지 보안이 아니다. 플러그인이 재시작 때마다 스스로 풀 수 있어야 하므로
  # 키가 같은 서버 안에 있어야 하고, 서버 파일을 통째로 얻은 상대에게는 소용이 없다. 설정 파일을
  # 남에게 보여주거나 백업이 돌아다닐 때 눈에 띄지 않게 하는 용도다.
  bot-token: ""
  # 인증 코드 유효 시간(초)
  verification-expiry-seconds: 300
  # 홈으로부터 이 거리(블록) 이내의 블록 파괴/상자 열기를 감지
  alert-radius: 30.0
  # 같은 플레이어에게 연속 알림을 보내지 않는 최소 간격(초)
  alert-cooldown-seconds: 60

# 웅크리기 + L키(도전과제 화면 열기)로 진입하는 전투 스킬 모드.
# 진입 시 1~4번 슬롯의 원래 아이템을 저장해두고 스킬 아이템으로 임시 교체하며(우클릭으로 발동),
# 다시 웅크리기+L을 누르면 해제되어 원래 아이템으로 복구된다. L키 감지에 쓰는 PacketEvents는
# 플러그인 jar에 포함되어 있어 따로 설치할 것이 없다. 스킬 4개의 실제 효과는 추후 결정되는 대로 구현 예정.
combat-stance:
  # 토글(진입/해제) 사이 최소 간격(밀리초). 도전과제 화면 관련 패킷이 짧은 시간에 중복으로
  # 와도 한 번만 처리하기 위한 안전장치
  toggle-cooldown-millis: 500
  skills:
    - name: "§b§l스킬 1"
      material: BLAZE_POWDER
    - name: "§b§l스킬 2"
      material: GLOWSTONE_DUST
    - name: "§b§l스킬 3"
      material: PHANTOM_MEMBRANE
    - name: "§b§l스킬 4"
      material: NETHER_STAR

# 신화 등급 무기 '레바테인' (/특수아이템소환 <유저> 레바테인 <수량> 으로 지급)
laevateinn:
  # resourcepack/ 의 커스텀 텍스처와 연결되는 CustomModelData 값 (리소스팩 미적용 서버에서는 무시되고 네더라이트 검 기본 아이콘으로 보임)
  model-data: 500020
  # BetterModel 플러그인(설치 시)에 등록된 3D 모델 이름. plugins/BetterModel/models/<이 값>.json 파일이 있어야 함.
  # BetterModel이 설치되어 있지 않으면 이 기능은 자동으로 비활성화되고 나머지 기능에는 영향이 없음.
  bettermodel-name: shadowflame
  # 근접 공격력 (툴팁/실제 데미지 계산에 쓰이는 최종 공격력 수치)
  attack-damage: 12.0
  # 지옥의 화상 상태에서 치유 효과 감소율(%)
  heal-reduction-percent: 50.0
  # 이 시간(틱, 20틱=1초) 이상 연속으로 물에 젖어 있으면 지옥의 화상이 해제됩니다.
  water-extinguish-ticks: 60
  # [패시브] 붉은 나뭇가지의 지옥화 - 평타를 맞힐 때마다 '업화'가 한 겹씩 쌓인다.
  # 중첩당 초당 피해가 늘어나며, 때릴 때마다 지속시간이 갱신된다 (방어력 무시).
  karma:
    duration-seconds: 6
    damage-per-second-per-stack: 1.5
    max-stacks: 5
  # [F] 수르트의 불길 - 전방 화염 폭풍. 땅을 잠시 마그마로 바꾸고 치유를 차단한다.
  ability:
    cooldown-seconds: 120
    range: 8.0
    cone-angle-degrees: 80.0
    damage: 20.0
    launch-power: 1.0
    burn-duration-seconds: 10
    burn-damage-per-second: 4.0
    magma-duration-seconds: 8
    # 적중한 대상의 치유/회복 효과를 완전히 차단하는 시간(초)
    heal-block-seconds: 5
  # [웅크리기+우클릭] 라그나로크 - 시전 중 모든 상태 이상 면역.
  # '영원불멸의 화염'은 방어력을 무시하고, 물에 들어가도 꺼지지 않는다.
  ragnarok:
    cooldown-seconds: 120
    # 기운을 모으는 시간(틱). 이 동안 상태 이상 면역이다.
    cast-ticks: 20
    range: 10.0
    cone-angle-degrees: 150.0
    # 방어력을 무시하는 즉발 피해
    damage: 18.0
    burn-duration-seconds: 12
    burn-damage-per-second: 5.0

# 신화 등급 무기 '사인참사검(四寅斬邪劍)' (/특수아이템소환 <유저> 사인참사검 <수량> 으로 지급)
sainchamsagum:
  # CustomModelData 값. 아직 리소스팩에 이 무기의 전용 텍스처가 없어서 지금은 네더라이트 검
  # 기본 아이콘으로 보인다 (번호만 미리 잡아둔 것). 나중에 텍스처를 추가하면 이 번호로 연결하면 된다.
  model-data: 500023
  attack-damage: 13.0
  # [패시브] 사기침노 - 검을 든 동안 반경 안의 적에게 둔화와 채굴 피로를 계속 건다.
  # 채굴 피로는 마인크래프트에서 공격 속도도 함께 떨어뜨린다 (단계당 -10%).
  aura:
    radius: 7.0
    slow-amplifier: 0
    mining-fatigue-amplifier: 0
  # [F] 인시의 참격 - 전방을 베고 '벽사의 저주'(방어력·회복량 감소)를 남긴다.
  slash:
    cooldown-seconds: 18
    range: 6.0
    cone-angle-degrees: 90.0
    damage: 14.0
    curse-duration-seconds: 8
    curse-defense-reduce-percent: 50.0
    curse-heal-reduce-percent: 50.0
  # [웅크리기+우클릭] 칠성강림 - 연속 참격. 시전 중 모든 상태 이상 면역.
  # 마지막 참격만 방어무시 고정 피해 + 침묵 + 제압을 건다.
  ultimate:
    cooldown-seconds: 90
    strikes: 7
    strike-interval-ticks: 8
    range: 7.0
    cone-angle-degrees: 70.0
    damage-per-strike: 6.0
    final-fixed-damage: 14.0
    final-silence-seconds: 4
    final-stun-seconds: 2

# 신화 등급 무기 '발뭉(Balmung)' (/특수아이템소환 <유저> 발뭉 <수량> 으로 지급)
balmung:
  # 사인참사검과 동일 — 전용 텍스처가 생기기 전까지는 네더라이트 검 기본 아이콘으로 보인다.
  model-data: 500024
  attack-damage: 14.0
  # [패시브] 용살의 긍지 - 상대 방어력이 높을수록 방어관통이 올라간다.
  # 관통률(%) = base + (상대 방어력 수치 x penetration-per-armor-point), 최대 max 까지.
  # 다이아 풀세트(방어력 20)면 10 + 20x3 = 70% → 상한에 걸려 70%.
  pride:
    base-penetration-percent: 10.0
    penetration-per-armor-point: 3.0
    max-penetration-percent: 70.0
    # 때릴 때마다 상대가 입은 갑주 4부위의 내구도를 이만큼 추가로 깎는다 (0이면 끔)
    armor-durability-damage: 3
  # [F] 그람의 참격 - 전방 직선을 관통하는 검기. '파프니르의 저주'(둔화+치유 차단)를 건다.
  gram:
    cooldown-seconds: 20
    range: 14.0
    # 직선의 굵기(반지름). 클수록 빗맞히기 어렵다.
    half-width: 1.2
    damage: 15.0
    curse-duration-seconds: 6
    curse-slow-amplifier: 2
  # [웅크리기+우클릭] 발뭉의 종말 - 넓은 부채꼴 검기 폭발. 시전 중 모든 상태 이상 면역.
  doom:
    cooldown-seconds: 100
    cast-ticks: 20
    range: 9.0
    cone-angle-degrees: 140.0
    damage: 12.0
    # 방어력을 무시하는 추가 고정 피해
    fixed-damage: 10.0
    stun-seconds: 2

# 신화 등급 무기 '자하신검(紫霞神劍)' (/특수아이템소환 <유저> 자하신검 <수량> 으로 지급)
jaha-shingeom:
  # 사인참사검과 동일 — 전용 텍스처가 생기기 전까지는 네더라이트 검 기본 아이콘으로 보인다.
  model-data: 500025
  attack-damage: 12.0
  # [패시브] 자하의 숨결
  passive:
    # 검을 손에 든 동안에만 붙는 이동속도 보너스(%)
    movement-speed-percent: 12.0
    # 평타 1회가 2회 타격으로 판정된다. 두 번째 타격의 배율.
    # 1.0 = 요청서 그대로 "완전한 2회 타격"(사실상 평타 2배). 0으로 두면 이 패시브를 끈다.
    second-hit-multiplier: 1.0
    # 평타 넉백 배율 (1.0 = 바닐라와 동일)
    knockback-multiplier: 1.25
  # [F 또는 웅크리기+우클릭] 낙매성우 - 시전 후 window-seconds 안에 적을 때리면
  # 그 일격이 total-hits 연타로 폭발한다. 추가타는 전부 방어력을 무시한다.
  plum-rain:
    cooldown-seconds: 60
    window-seconds: 3
    total-hits: 7
    # 최초 1타를 뺀 나머지 6타 각각의 배율. 1.0으로 두면 요청서 그대로 '완전한 7연타'가 되는데,
    # 공격력 12 기준 한 번에 80 이상이 들어가 사실상 즉사기가 된다. 기본값은 0.6.
    extra-hit-multiplier: 0.6

