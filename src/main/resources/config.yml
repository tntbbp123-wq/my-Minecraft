# MyMinecraft 설정 파일

economy:
  starting-balance: 1000.0
  currency-name: "G"

home:
  max-homes: 5

tpa:
  request-timeout-seconds: 30

# PvP 전투 로그 방지: 다른 플레이어를 공격하거나 공격받으면 이 시간(초) 동안 "전투 중" 상태가 됩니다.
combat:
  # 전투 중에는 관리자(myminecraft.admin)를 제외한 모든 명령어 사용이 막힙니다.
  # 전투 중 상태로 접속을 종료하면 즉시 사망 처리됩니다.
  tag-seconds: 45
  # 전투 태그가 걸려 있는 동안 전투 음악을 재생한다. 소리가 플레이어를 따라다니므로
  # 도망쳐도 끊기지 않는다.
  # 음원은 저작권 때문에 저장소에 포함되어 있지 않다. README의 "전투 음악" 항목을 보고
  # 리소스팩에 직접 넣은 뒤 enabled를 true로 바꿔야 소리가 난다.
  # 리소스팩을 적용하지 않은 플레이어에게는 아무 소리도 안 날 뿐 다른 영향은 없다.
  music:
    enabled: false
    # 리소스팩 sounds.json에 등록한 사운드 이름
    sound: "myminecraft:music.combat"
    # 트랙 길이(초). 전투가 이보다 길어지면 다시 처음부터 재생해 끊기지 않게 한다.
    track-length-seconds: 142
    volume: 0.7

randomtp:
  # 중심(월드 스폰 좌표)으로부터 이 반경(블록) 안에서만 이동합니다.
  max-radius: 5000
  # 중심 기준 이 크기(가로x세로, 블록)의 정사각형 지역은 랜덤 이동 대상에서 제외됩니다.
  exclude-size: 500
  cooldown-seconds: 30
  # 안전한 착지 지점을 찾기 위한 최대 시도 횟수
  max-attempts: 30

# 실물 화폐(동전) - 주식 거래소에서 포인트 <-> 동전으로 환전 가능
currency:
  coins:
    - id: coin_1g
      value: 1
      name: "1G 동전"
      color: "6"
      material: COPPER_INGOT
      model-data: 500050
    - id: coin_10g
      value: 10
      name: "10G 동전"
      color: "7"
      material: IRON_INGOT
      model-data: 500051
    - id: coin_100g
      value: 100
      name: "100G 동전"
      color: "e"
      material: GOLD_INGOT
      model-data: 500052
    - id: coin_1000g
      value: 1000
      name: "1000G 동전"
      color: "b"
      material: DIAMOND
      model-data: 500053
    - id: coin_10000g
      value: 10000
      name: "10000G 동전"
      color: "5"
      material: NETHERITE_INGOT
      model-data: 500054

stock:
  # 주식 가격 갱신 주기(초). 서버가 꺼져있던 시간도 계산에 포함되어, 다시 켜면 밀린 만큼
  # 갱신하고 스케줄을 이어갑니다 (stockdata.yml에 마지막 갱신 시각이 저장됨).
  update-interval-seconds: 3600
  # 기본 제공 종목은 없습니다. 관리자가 /주식종류추가 로 직접 추가한 종목만 거래소에 나타납니다.
  list: []

# 관리자가 /뉴스작성, /가짜뉴스작성 으로 작성한 뉴스의 공개/반영 타이밍
news:
  # 작성 후 이 시간(초)이 지나면 주식 거래소 GUI에서 해당 종목에 커서를 올렸을 때 보이기 시작합니다.
  reveal-delay-seconds: 3600
  # 작성 후 이 시간(초)이 지나면 (가짜 뉴스가 아닌 경우) 실제로 해당 종목 가격에 반영됩니다.
  apply-delay-seconds: 7200
  # AI가 등락 방향/변동폭을 직접 정할 때(예: /뉴스작성 <종목명> AI:<주제>) 허용되는 변동폭(%) 범위.
  ai-min-magnitude-percent: 1.0
  ai-max-magnitude-percent: 10.0

# 뉴스 작성 시 "AI:주제" 형식으로 입력하면 아래 AI API로 기사 본문을 자동 생성합니다.
# Google AI Studio(https://aistudio.google.com/)에서 무료로 Gemini API 키를 발급받아 넣으세요.
ai:
  enabled: false
  provider: "gemini"
  api-key: ""
  model: "gemini-2.5-flash"

enhance:
  # 강화석 아이콘 재질 (전용 아이템이며, /특수아이템소환 <유저> 강화석 <수량> 으로 지급)
  material: AMETHYST_SHARD
  # resourcepack/ 의 커스텀 텍스처와 연결되는 CustomModelData 값 (리소스팩 미적용 서버에서는 무시되고 기본 아이콘으로 보임)
  model-data: 500001
  # 강화 GUI 진행 표시(0➜+1 ~ 9➜+10)에 쓰이는 CustomModelData 시작값. resourcepack/에 레벨별로
  # 10개(model-data ~ model-data+9)가 미리 준비되어 있음. 리소스팩 미적용 시 기본 화살표 아이콘으로 보임.
  progress-model-data-base: 500040
  # 확률 강화 두루마리 등급 목록 (전용 아이템이며, /특수아이템소환 <유저> <등급>두루마리 <수량> 으로 지급)
  scrolls:
    - id: common
      name: "일반등급 두루마리"
      material: PAPER
      color: f
      model-data: 500010
      bonus-percent: 10.0
    - id: rare
      name: "레어등급 두루마리"
      material: PAPER
      color: 9
      model-data: 500011
      bonus-percent: 20.0
    - id: epic
      name: "에픽등급 두루마리"
      material: PAPER
      color: 5
      model-data: 500012
      bonus-percent: 30.0
    - id: legendary
      name: "레전더리등급 두루마리"
      material: PAPER
      color: 6
      model-data: 500013
      bonus-percent: 45.0
  # 성공 확률: guaranteed-level강까지는 base-success-percent로 무조건 성공하고, 그 이후로는
  # 한 단계 강화할 때마다 직전 확률에 decay-multiplier를 곱해 감소한다 (기본: 0강~4강 100%,
  # 5강부터 직전 확률의 80%씩 — 10강 26.214% / 15강 8.590% / 20강 2.815% / 30강 0.302%).
  # 계산된 확률이 min-success-percent보다 낮아지면 그 값으로 고정된다.
  base-success-percent: 100.0
  guaranteed-level: 4
  decay-multiplier: 0.8
  min-success-percent: 0.001
  # 기본 강화 한계치. <초월의 제단>에서 초월한 장비는 transcended-max-level까지 강화 가능.
  max-level: 20
  transcended-max-level: 30
  base-cost: 100.0
  cost-per-level: 50.0
  # 무기(검/도끼/삼지창/활/철퇴 등) 강화 시 레벨당 상승하는 기본 공격력/공격속도
  attack-damage-per-level: 0.5
  attack-speed-per-level: 0.02

# 스타포스 (/특수아이템소환 <유저> 별가루 <수량> 으로 지급). 별가루를 소모해 무기에 '성'을
# 붙이며, 성 개수당 방어관통(%)이 오른다. 10성을 달성하면 무기 종류별 특수 능력이 열린다
# (10성 특수 능력 자체는 다음 업데이트에서 구현 예정).
starforce:
  # 별가루 아이콘 재질 (전용 아이템)
  material: GLOWSTONE_DUST
  # resourcepack/ 의 커스텀 텍스처와 연결되는 CustomModelData 값 (리소스팩 미적용 서버에서는 무시되고 기본 아이콘으로 보임)
  model-data: 500003
  # 성 1개를 붙일 때마다 소모되는 별가루 개수
  stardust-per-star: 1
  # 최대 별(성) 개수
  max-stars: 10
  # 별 1개당 상승하는 방어관통 수치(%). 최대 별 개수를 곱한 값이 상한.
  defense-penetration-per-star: 3.0

# 초월의 제단을 실제 블록처럼 세계에 세울 때 쓰는 설정 (/초월제단설치 명령어로 설치).
# 진짜 새 블록 타입을 만들 수는 없어서 ItemDisplay 엔티티로 떠 있는 아이템을 보여주는 방식이며,
# 오른쪽 클릭하면 초월의 제단 GUI가 열린다.
transcend-altar:
  # 표시 아이템 기본 재질 (커스텀 텍스처가 없어도 그럴듯하게 보이도록 기본은 END_CRYSTAL)
  material: END_CRYSTAL
  # resourcepack/ 의 커스텀 텍스처와 연결되는 CustomModelData 값 (리소스팩 미적용 서버에서는 기본 아이콘으로 보임)
  model-data: 500030
  # 표시 크기 배율
  scale: 1.5

# 암시장 아이템.
# /특수아이템소환 <유저> <아이템명> <수량> 으로 지급 (아이템명은 위 각 항목 참고).
blackmarket:
  loot-all-scroll:
    material: PAPER
    model-data: 500050
  trap-kit:
    material: TRIPWIRE_HOOK
    model-data: 500051
    # DEBUFF: 강한 독+위더 디버프 부여 / TNT: 강한 폭발(TNT) 즉시 발동
    mode: DEBUFF
    poison-duration-seconds: 10
    wither-duration-seconds: 10
  molotov:
    material: SPLASH_POTION
    model-data: 500052
    # 착탄 지점 발화/생물 발화 반경(블록)
    radius: 3.0
    # 착탄 시 근처 생물에게 붙는 불(틱, 20틱=1초)
    entity-fire-ticks: 100
  smoke-bomb:
    material: SPLASH_POTION
    model-data: 500053
    # 연막(실명 효과) 반경(블록)
    radius: 4.0
    # 연막 지속시간(틱, 20틱=1초)
    duration-ticks: 100
  density-compass:
    material: COMPASS
    model-data: 500054
    # 스캔 반경(블록). 로드된 청크만 검사함
    radius: 64
    # 재사용 대기시간(초)
    cooldown-seconds: 30
  footprint-tracker:
    material: ARROW
    model-data: 500055
    # 흔적이 남는 시간(틱, 20틱=1초)
    duration-ticks: 3600
  blood-compass:
    material: COMPASS
    model-data: 500056
    # 실제 위치에서 무작위로 어긋나게 하는 반경(블록) — "대략적인" 위치를 표현하기 위함
    jitter-radius: 20.0
  silence-potion:
    material: POTION
    model-data: 500057
    # 효과 지속시간(틱, 20틱=1초)
    duration-ticks: 600

# 디스코드 침입 알림 (암시장 마지막 기능). 아래 bot-token을 채워야 활성화됨.
# 1. https://discord.com/developers/applications 에서 애플리케이션+봇을 만들고 토큰을 발급받는다.
# 2. 봇을 자신의 디스코드 서버에 초대한다 (OAuth2 URL Generator에서 bot 스코프 선택).
# 3. 알림을 받을 플레이어는 그 서버에 들어가 있어야 하고, 게임에서 /디스코드연동 <디스코드ID>로
#    인증 코드를 DM으로 받은 뒤 /디스코드연동확인 <코드>로 연동을 완료해야 한다.
# 연동한 플레이어가 /홈설정 으로 등록해둔 홈 근처(alert-radius)에서 다른 플레이어가 블록을
# 부수거나 상자류를 열면 디스코드 DM으로 알림이 온다. bot-token이 비어있으면 이 기능 전체가
# 비활성화되고 나머지 플러그인 기능에는 영향이 없다.
discord:
  # 토큰은 아래 네 가지 형식 중 하나로 적을 수 있다.
  #   "실제토큰"          - 평문 그대로 (간단하지만 config를 보는 사람에게 그대로 노출됨)
  #   "env:이름"          - 환경변수에서 읽음. 값이 어느 파일에도 남지 않아 가장 안전하다.
  #   "file:/경로/파일"   - 다른 파일에서 읽음. config를 통째로 보여줘도 값은 노출되지 않는다.
  #   "enc:..."           - plugins/MyMinecraft/secret.key 로 복호화. 평문을 적어둔 뒤
  #                         게임에서 /토큰암호화 를 실행하면 바꿀 값을 알려준다.
  # 주의: enc: 는 암호화지 보안이 아니다. 플러그인이 재시작 때마다 스스로 풀 수 있어야 하므로
  # 키가 같은 서버 안에 있어야 하고, 서버 파일을 통째로 얻은 상대에게는 소용이 없다. 설정 파일을
  # 남에게 보여주거나 백업이 돌아다닐 때 눈에 띄지 않게 하는 용도다.
  bot-token: ""
  # 인증 코드 유효 시간(초)
  verification-expiry-seconds: 300
  # 홈으로부터 이 거리(블록) 이내의 블록 파괴/상자 열기를 감지
  alert-radius: 30.0
  # 같은 플레이어에게 연속 알림을 보내지 않는 최소 간격(초)
  alert-cooldown-seconds: 60

# 웅크리기 + L키(도전과제 화면 열기)로 진입하는 전투 스킬 모드.
# 진입 시 1~4번 슬롯의 원래 아이템을 저장해두고 스킬 아이템으로 임시 교체하며(우클릭으로 발동),
# 다시 웅크리기+L을 누르면 해제되어 원래 아이템으로 복구된다. ProtocolLib이 설치되어 있어야
# 동작한다(L키 감지에 사용). 스킬 4개의 실제 효과는 추후 결정되는 대로 구현 예정.
combat-stance:
  # 토글(진입/해제) 사이 최소 간격(밀리초). 도전과제 화면 관련 패킷이 짧은 시간에 중복으로
  # 와도 한 번만 처리하기 위한 안전장치
  toggle-cooldown-millis: 500
  skills:
    - name: "§b§l스킬 1"
      material: BLAZE_POWDER
    - name: "§b§l스킬 2"
      material: GLOWSTONE_DUST
    - name: "§b§l스킬 3"
      material: PHANTOM_MEMBRANE
    - name: "§b§l스킬 4"
      material: NETHER_STAR

# 신화 등급 무기 '레바테인' (/특수아이템소환 <유저> 레바테인 <수량> 으로 지급)
laevateinn:
  # resourcepack/ 의 커스텀 텍스처와 연결되는 CustomModelData 값 (리소스팩 미적용 서버에서는 무시되고 네더라이트 검 기본 아이콘으로 보임)
  model-data: 500020
  # BetterModel 플러그인(설치 시)에 등록된 3D 모델 이름. plugins/BetterModel/models/<이 값>.json 파일이 있어야 함.
  # BetterModel이 설치되어 있지 않으면 이 기능은 자동으로 비활성화되고 나머지 기능에는 영향이 없음.
  bettermodel-name: shadowflame
  # 근접 공격력 (툴팁/실제 데미지 계산에 쓰이는 최종 공격력 수치)
  attack-damage: 12.0
  # 지옥의 화상 상태에서 치유 효과 감소율(%)
  heal-reduction-percent: 50.0
  # 이 시간(틱, 20틱=1초) 이상 연속으로 물에 젖어 있으면 지옥의 화상이 해제됩니다.
  water-extinguish-ticks: 60
  # 공격 적중 시 부여되는 지옥의 화상
  onhit:
    burn-duration-seconds: 6
    burn-damage-per-second: 3.0
  # 라그나로크의 숨결 (F키 발동)
  ability:
    cooldown-seconds: 120
    range: 8.0
    cone-angle-degrees: 80.0
    damage: 20.0
    launch-power: 1.0
    burn-duration-seconds: 10
    burn-damage-per-second: 4.0
    magma-duration-seconds: 8

# 신화 등급 무기 '드라켄피어스' (/특수아이템소환 <유저> 드라켄피어스 <수량> 으로 지급)
draken-pierce:
  # resourcepack/ 의 커스텀 텍스처와 연결되는 CustomModelData 값 (리소스팩 미적용 서버에서는 무시되고 삼지창 기본 아이콘으로 보임)
  model-data: 500021
  # 근접 공격력 (툴팁/실제 데미지 계산에 쓰이는 최종 공격력 수치)
  attack-damage: 11.0
  # 항상 적용되는 고정 방어관통(%). 스타포스로 붙인 방어관통과는 별개로 중첩 적용됨
  defense-penetration-percent: 45.0
  # 감전(둔화) 디버프 공통 설정
  shock:
    # 둔화(Slowness) 효과 단계 (0 = 둔화 I)
    slow-amplifier: 1
  # 드라켄 라이트닝 (F키 발동) - 전방 적을 맞히면 번개가 주변으로 연쇄
  lightning:
    cooldown-seconds: 20
    range: 10.0
    cone-angle-degrees: 50.0
    damage: 9.0
    # 최초 적중 대상 기준, 추가로 연쇄되는 최대 인원
    chain-count: 3
    # 연쇄가 다음 대상을 찾는 반경(블록)
    chain-radius: 4.0
    # 연쇄로 옮겨붙을 때마다 적용되는 피해 배율 (최초 적중 대비)
    chain-damage-multiplier: 0.6
    shock-duration-seconds: 5
    shock-damage-per-second: 2.5
  # 드라코닉 메타모포시스 (Q키 발동) - 번개 폭발 후 쌍단검으로 일시 변형
  metamorphosis:
    cooldown-seconds: 25
    # 변형 지속시간(초). 이동속도/공격속도 상승도 이 시간 동안 유지됨
    duration-seconds: 7
    # 변형 중 무기에 적용되는 CustomModelData (리소스팩 미적용 서버/전용 텍스처 미포함 시 원래 모습 그대로 보임)
    model-data: 500022
    # 발동 시 전방 번개 폭발의 범위/각도/피해
    burst-range: 4.0
    burst-cone-angle-degrees: 140.0
    burst-damage: 6.0
    shock-duration-seconds: 4
    shock-damage-per-second: 2.0
    # 변형 중 이동속도 효과 단계 (0 = 신속 I)
    speed-amplifier: 2
    # 변형 중 무기에 임시로 더해지는 공격속도 수치
    attack-speed-bonus: 0.6

# 레이드 보스. /레이드보스 소환 <보스ID> 로 관리자가 직접 소환한다.
raid-boss:
  # '끝없는 기사' - 체력이 0이 되면 죽는 대신 쓰러지고, 주변에 떨어지는 '영혼의 파편'을
  # knockdown.duration-seconds 안에 전부 파괴해야만 진짜로 처치된다. 못 부수면 검기를
  # 방출하며 체력을 모두 회복하고 부활한다 (페이즈 반복).
  eternal-knight:
    max-health: 600.0
    # 패턴이 대상을 탐색하는 반경(블록)
    engage-range: 24.0
    # 불멸의 의지 - 체력이 닳을수록, 그리고 부활할수록 이동속도/공격력이 상승한다.
    will:
      base-movement-speed: 0.28
      movement-speed-per-lost-ratio: 0.12
      movement-speed-per-knockdown: 0.03
      base-attack-damage: 9.0
      attack-damage-per-lost-ratio: 6.0
      attack-damage-per-knockdown: 2.0
    # 연속 참격 - 전방 부채꼴을 빠르게 연타한다.
    combo:
      cooldown-seconds: 8
      strike-count: 5
      strike-interval-ticks: 5
      range: 4.5
      cone-angle-degrees: 100.0
      damage-per-strike: 5.0
    # 반격 태세 - 자세를 잡는 동안 근접 공격을 하면 카운터 피해와 스턴이 돌아온다.
    counter:
      cooldown-seconds: 18
      duration-seconds: 4
      damage: 14.0
      stun-seconds: 2
    # 처형자의 돌진 - 일직선으로 돌진하며 경로상 대상의 방패를 사용 불가로 만든다.
    charge:
      cooldown-seconds: 12
      speed: 1.6
      duration-ticks: 20
      hit-radius: 2.5
      damage: 12.0
      shield-disable-seconds: 5
    # 불사의 육체 / 영혼의 파편 (처치 기믹)
    knockdown:
      duration-seconds: 6
      fragment-count: 4
      fragment-radius: 4.0
      revive-wave-radius: 6.0
      revive-wave-damage: 16.0

  # '기억할 수 없는 자' - 인지를 오염시키는 보스. 정면에서 눈을 마주보고 있으면 사고가
  # 정지되므로, 화면을 돌린 채 측면이나 후방에서 공격해야 한다.
  # 원안의 "미니맵/UI 지우기"는 서버가 클라이언트 화면을 건드릴 수 없어 그대로는 구현할 수 없고,
  # 암전(실명+어둠)과 닉네임 숨김으로 대체했다.
  oblivion:
    max-health: 700.0
    attack-damage: 10.0
    engage-range: 24.0
    # 정신 붕괴의 응시 (패시브)
    gaze:
      # 이 거리(블록) 안에서만 판정한다
      range: 8.0
      # 이 시간(초) 이상 연속으로 직시하면 사고 정지에 빠진다
      required-seconds: 1.5
      # 플레이어의 시선이 보스를 향한 것으로 볼 각도. 좁을수록 "정확히 쳐다봐야" 걸린다
      player-angle-degrees: 40.0
      # 보스의 정면으로 볼 각도. 이 범위 밖(측면/후방)에 있으면 아무리 봐도 걸리지 않는다
      boss-front-angle-degrees: 120.0
      # 사고 정지 지속시간(초) - 이동/명령어/채팅/스킬이 전부 막히고 암전된다
      mind-break-seconds: 3
      # 사고 정지 중 초당 피해
      damage-per-second: 4.0
    # 기억 소거의 파동 (액티브) - 주변 플레이어의 핫바 아이템을 일시적으로 쓸 수 없게 만든다
    wave:
      cooldown-seconds: 20
      radius: 15.0
      seal-seconds: 5
    # 존재의 망각 (궁극기) - 체력이 이 비율 이하로 떨어지면 발동해 끝까지 유지된다
    ultimate:
      health-threshold: 0.5
      radius: 20.0
      darkness-refresh-seconds: 3

# 코어 (팀 거점 겸 상점). 신호기(Beacon)를 변형해 만들어져 있어, 제작한 뒤 바닥에 설치하면
# 실제 신호기 블록이 되고 그 위치가 설치한 사람의 팀 거점(홈)이 된다. 우클릭하면 바닐라
# 신호기 GUI 대신 전용 상점 GUI가 열린다. 제작법: 네더별-드래곤의 숨결-네더별 /
# 바다의 심장-유리-바다의 심장 / 철블럭-철블럭-철블럭 (3x3, 신호기와 유사한 배치).
# /팀생성 으로 팀을 만들면 팀장에게 코어 1개가 자동 지급된다.
core:
  # resourcepack/ 의 커스텀 텍스처와 연결되는 CustomModelData 값 (리소스팩 미적용 서버에서는 무시되고 신호기 기본 아이콘으로 보임)
  model-data: 500040
  # 상점에서 아이템을 살 때 차감되는 포인트(economy.starting-balance와 같은 재화) 가격.
  # 키는 /특수아이템소환 과 동일한 아이템명을 사용한다.
  shop:
    prices:
      강화석: 50.0
      별가루: 80.0
      일반두루마리: 100.0
      레어두루마리: 250.0
      에픽두루마리: 600.0
      레전더리두루마리: 1500.0
      일괄약탈주문서: 300.0
      함정설치키트: 200.0
      화염병: 80.0
      연막탄: 60.0
      밀도나침반: 150.0
      발자국추적기: 150.0
      혈흔나침반: 200.0
      소음차단포션: 120.0
