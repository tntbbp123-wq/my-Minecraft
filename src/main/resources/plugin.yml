name: MyMinecraft
version: ${project.version}
main: com.tntbbp.myminecraft.MyMinecraftPlugin
api-version: '1.21'
author: tntbbp
description: ${project.description}

commands:
  tpa:
    description: 다른 플레이어에게 텔레포트 요청을 보냅니다.
    usage: /tpa <player>
  tpaccept:
    description: 텔레포트 요청을 수락합니다.
    usage: /tpaccept
  tpdeny:
    description: 텔레포트 요청을 거절합니다.
    usage: /tpdeny
  home:
    description: 홈 목록 GUI를 엽니다.
    usage: /home
    aliases: [homes]
  sethome:
    description: 현재 위치를 홈으로 저장합니다.
    usage: /sethome <name>
  delhome:
    description: 저장된 홈을 삭제합니다.
    usage: /delhome <name>
  ec:
    description: 어디서든 엔더상자를 엽니다.
    usage: /ec
    aliases: [enderchest]
  menu:
    description: 메인 메뉴 GUI를 엽니다.
    usage: /menu
  lobby:
    description: 로비로 이동합니다.
    usage: /lobby
  spawn:
    description: 스폰으로 이동합니다.
    usage: /spawn
  rt:
    description: 중앙 500x500 지역을 제외한 랜덤 위치로 이동합니다.
    usage: /rt
    aliases: [randomtp]
  enhanceitem:
    description: 관리자가 강화석/등급별 확률 강화 두루마리를 지급합니다.
    usage: /enhanceitem <stone|scroll:<common|rare|epic|legendary>> <player> [amount]

permissions:
  myminecraft.admin:
    description: 스폰/로비 설정 등 관리자 명령 권한
    default: op
