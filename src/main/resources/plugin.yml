name: MyMinecraft
version: ${project.version}
main: com.tntbbp.myminecraft.MyMinecraftPlugin
api-version: '1.21'
author: tntbbp
description: ${project.description}

commands:
  텔레포트요청:
    description: "다른 플레이어에게 텔레포트 요청을 보냅니다."
    usage: "/텔레포트요청 <플레이어>"
  텔레포트수락:
    description: "텔레포트 요청을 수락합니다."
    usage: "/텔레포트수락"
  텔레포트거절:
    description: "텔레포트 요청을 거절합니다."
    usage: "/텔레포트거절"
  홈:
    description: "홈 목록 GUI를 엽니다."
    usage: "/홈"
  홈설정:
    description: "현재 위치를 홈으로 저장합니다."
    usage: "/홈설정 <이름>"
  홈삭제:
    description: "저장된 홈을 삭제합니다."
    usage: "/홈삭제 <이름>"
  엔더상자:
    description: "어디서든 엔더상자를 엽니다."
    usage: "/엔더상자"
  메뉴:
    description: "메인 메뉴 GUI를 엽니다."
    usage: "/메뉴"
  로비:
    description: "로비로 이동합니다. (관리자 전용: /로비 설정)"
    usage: "/로비 [설정]"
  스폰:
    description: "스폰으로 이동합니다. (관리자 전용: /스폰 설정)"
    usage: "/스폰 [설정]"
  랜덤이동:
    description: "중앙 500x500 지역을 제외한 랜덤 위치로 이동합니다."
    usage: "/랜덤이동"
  특수아이템소환:
    description: "관리자가 강화석/두루마리/레바테인 등 특수 아이템을 지급합니다."
    usage: "/특수아이템소환 <유저> <아이템명> <수량>"
  주식종류추가:
    description: "관리자가 새 주식 종목을 추가합니다 (시작가는 최소값으로 설정됨)."
    usage: "/주식종류추가 <이름> <최소값> <최대값> <변동단위> <업종>"
  주식지급:
    description: "관리자가 대가 없이 플레이어에게 주식을 지급합니다."
    usage: "/주식지급 <종목명> <유저> <수량>"
  뉴스작성:
    description: "관리자가 뉴스를 예약 작성합니다 (1시간 뒤 공개, 2시간 뒤 가격 반영)."
    usage: "/뉴스작성 <종목명> <상승|하락> <변동폭%> <내용 또는 AI:주제> (AI:[주제]만 쓰면 AI가 등락도 정함)"
  가짜뉴스작성:
    description: "관리자가 가짜 뉴스를 예약 작성합니다 (1시간 뒤 공개, 가격에는 반영되지 않음)."
    usage: "/가짜뉴스작성 <종목명> <상승|하락> <변동폭%> <내용 또는 AI:주제> (AI:[주제]만 쓰면 AI가 등락도 정함)"
  관리자메뉴:
    description: "관리자 전용 메뉴 GUI를 엽니다."
    usage: "/관리자메뉴"

permissions:
  myminecraft.admin:
    description: "스폰/로비 설정 등 관리자 명령 권한"
    default: op
